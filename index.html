<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="author" content="Ir. Ts. Dr. Muhammad Hafiz HASSAN, School of Mechanical Engineering, Tuanku Syed Sirajuddin Engineering Campus, Universiti Sains Malaysia, Pulau Pinang">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIMULASI UMRAH: Niat hingga Tahallul V1</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f3d2e">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="description" content="Simulasi Umrah: panduan langkah demi langkah dari niat hingga tahallul, dengan simulasi 3D tawaf dan sa'ie.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Amiri:wght@400;700&family=Noto+Sans+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --glass: rgba(255,255,255,.82);
  --glass-edge: rgba(0,0,0,.08);
  --ink: #1c1913;
  --ink-soft: #5b5446;
  --gold: #9a7621;
  --green: #17894f;
  --chip: rgba(0,0,0,.06);
  --chip-on: #1c1913;
  --chip-on-ink: #fff;
  --bg: #cfe3f3;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --glass: rgba(20,18,14,.78); --glass-edge: rgba(255,255,255,.1);
    --ink:#f3eee2; --ink-soft:#bdb4a0; --gold:#dcb75c; --green:#3fcf85;
    --chip: rgba(255,255,255,.09); --chip-on:#f3eee2; --chip-on-ink:#14120e; --bg:#0d1620;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --glass: rgba(20,18,14,.78); --glass-edge: rgba(255,255,255,.1);
  --ink:#f3eee2; --ink-soft:#bdb4a0; --gold:#dcb75c; --green:#3fcf85;
  --chip: rgba(255,255,255,.09); --chip-on:#f3eee2; --chip-on-ink:#14120e; --bg:#0d1620;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;color:var(--ink)}
#realv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:none}
@media (min-aspect-ratio:1/1){#realv{object-fit:contain}}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--glass);border:1px solid var(--glass-edge);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px}
#hud{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));max-width:min(420px, calc(100vw - 160px));padding:12px 14px;display:none}
#lap{font-weight:800;font-size:28px;line-height:1;letter-spacing:-.5px}
#lap small{font-size:15px;font-weight:600;color:var(--ink-soft)}
#seg{margin-top:8px;font-weight:800;font-size:15px;color:var(--gold)}
#guide{margin-top:4px;font-size:14px;line-height:1.45}
#ar{font-family:Amiri, "Noto Naskh Arabic", serif;font-size:22px;line-height:1.7;direction:rtl;text-align:right;margin-top:6px}
#tr{font-size:13px;font-style:italic;color:var(--ink-soft)}
#tip{margin-top:8px;font-size:12.5px;color:var(--ink-soft);border-top:1px solid var(--glass-edge);padding-top:6px}
#map{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:128px;height:128px;display:none;padding:0}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:none;gap:6px;padding:8px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 16px)}
button{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:10px;padding:9px 12px;background:var(--chip);color:var(--ink);cursor:pointer}
button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sp{display:flex;gap:2px;background:var(--chip);border-radius:10px;padding:2px}
.sp button{background:transparent;padding:7px 9px}
.sp button[aria-pressed="true"]{background:var(--chip-on)}
#intro{position:fixed;inset:0;display:none;place-items:center;padding:16px;overflow:auto}
#journey{position:fixed;inset:0;display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
#jcard{max-width:580px;width:100%;padding:20px 22px;max-height:100%;overflow:auto}
#jtop{display:flex;gap:8px 10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
#jsteps{display:flex;gap:4px;flex:1 1 140px;min-width:140px}
#jsteps i{flex:1;height:6px;border-radius:3px;background:var(--chip)}
#jsteps i.on{background:var(--gold)}#jsteps i.cur{background:var(--green)}
.pill{font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--chip);color:var(--ink-soft);white-space:nowrap}
.pill.p-on{background:#17894f;color:#fff}.pill.p-done{background:var(--gold);color:#fff}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;padding:4px 8px;border-radius:6px;margin:0 6px 4px 0}
.b-rukun{background:#9a7621;color:#fff}.b-wajib{background:#17894f;color:#fff}.b-sunat{background:var(--chip);color:var(--ink)}
#jtitle{margin:6px 0 8px;font-size:26px;letter-spacing:-.5px;line-height:1.15}
#jbody{font-size:14.5px;line-height:1.55}
#jbody p{margin:6px 0}
#jbody h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);margin:16px 0 6px}
#jbody ul,#jbody ol{padding-left:22px;margin:6px 0}#jbody li{margin:4px 0}
.lafaz{border:1px solid var(--glass-edge);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--chip)}
.lafaz .a{font-family:Amiri,"Noto Naskh Arabic",serif;font-size:23px;line-height:1.8;direction:rtl;text-align:right;color:var(--gold)}
.lafaz .t{font-style:italic;font-size:13.5px;color:var(--ink-soft)}.lafaz .m{font-size:13.5px;margin-top:4px}
.src{font-size:12px!important;color:var(--ink-soft)}.src a{color:var(--gold)}
.act{width:100%;margin-top:14px;padding:13px;font-weight:800;background:var(--green);color:#fff}
#jnav{display:flex;gap:8px;margin-top:18px}#jnav button{flex:1;padding:12px}
#jnext{background:var(--chip-on);color:var(--chip-on-ink)}
button:disabled{opacity:.4;cursor:default}
.cut{display:flex;gap:26px;justify-content:center;margin:10px 0 4px}
.strand{background:var(--chip);color:#3a2a1c;padding:8px 14px;border-radius:12px;transition:opacity .3s,transform .3s}
:root[data-theme="dark"] .strand{color:#d9c3a5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .strand{color:#d9c3a5}}
.strand.gone{opacity:.15;transform:translateY(10px) rotate(25deg);pointer-events:none}
.cutmsg{text-align:center;font-weight:700;font-size:13.5px}
.tl li{font-weight:700}
#toGuide{margin-bottom:10px}
.credit{margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--glass-edge);font-size:11.5px;line-height:1.5;color:var(--ink-soft);text-align:center}
.credit b{color:var(--ink);font-weight:800}

#jlang{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:10px;padding:8px 10px;background:var(--chip);color:var(--ink)}
#jbody p:not(.src):not(.cutmsg),#card p:not(.credit):not(.fine),#guide{text-align:justify;text-justify:inter-word;-webkit-hyphens:auto;hyphens:auto}
#jbody li{text-align:justify;-webkit-hyphens:auto;hyphens:auto}
:root[lang="ar"] body{font-family:"Noto Sans Arabic",Manrope,system-ui,sans-serif}
:root[lang="ar"] #jbody ul,:root[lang="ar"] #jbody ol{padding-left:0;padding-right:22px}
:root[lang="ar"] #ar{text-align:center}
:root[lang="ar"] #tr{display:none!important}
.lafaz .t:empty,.lafaz .m:empty{display:none}
#journey{background:linear-gradient(180deg,#e9f1ec,#f7f4ec)}
:root[data-theme="dark"] #journey{background:linear-gradient(180deg,#0c1a14,#0b0a08)}
:root[data-theme="light"] #jcard,:root[data-theme="light"] #card{background:rgba(253,252,249,.97)}
:root[data-theme="dark"] #jcard,:root[data-theme="dark"] #card{background:rgba(22,20,16,.96)}
#hint{position:fixed;left:50%;top:56%;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:4;padding:14px 22px 16px;border-radius:20px;background:rgba(12,12,12,.5);color:#fff;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);text-align:center}
#hint .hand{font-size:56px;line-height:1.1;animation:swipe 1.6s ease-in-out infinite}
#hint .arr{font-weight:800;font-size:20px;letter-spacing:.12em;direction:ltr}
#hintTxt{font-weight:700;font-size:14px;max-width:220px}
@keyframes swipe{0%,100%{transform:translateX(-38px) rotate(-12deg)}50%{transform:translateX(38px) rotate(12deg)}}
@media (prefers-reduced-motion: reduce){#hint .hand{animation:none}}
.themeBtn{font-size:16px;line-height:1;padding:8px 11px;min-width:40px}
.credit-logo{display:block;margin:0 auto 10px;width:72%;max-width:230px;height:auto;background:#fff;border-radius:8px;padding:6px 10px;box-sizing:border-box}
#card{max-width:440px;padding:22px}
#card h1{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.8px}
#card .sub{margin:6px 0 14px;color:var(--ink-soft);font-size:15px}
#card p{font-size:14px;line-height:1.55;margin:0 0 12px}
#card .ar{font-family:Amiri, serif;font-size:26px;text-align:center;color:var(--gold);margin:2px 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.row span{font-size:13px;color:var(--ink-soft);min-width:70px}
#go{width:100%;margin-top:10px;padding:14px;font-size:16px;font-weight:800;background:var(--green);color:#fff}
.fine{font-size:11.5px!important;color:var(--ink-soft)}
#flash{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font-weight:800;font-size:22px;padding:12px 18px;pointer-events:none;opacity:0;transition:opacity .4s}
@media (max-width:560px){
  #hud{max-width:calc(100vw - 24px);right:12px;padding:10px 12px}
  #map{top:auto;bottom:calc(118px + env(safe-area-inset-bottom,0px));width:104px;height:104px}
  #lap{font-size:24px}
  #ar{font-size:19px}
}
@media (prefers-reduced-motion: reduce){#flash{transition:none}}
</style>
</head>

const isSmall=matchMedia("(max-width:700px)").matches;
let N=0, agents=[], bodyMesh=null, headMesh=null, headCover=null;
const R_OUT=46;
function rMin(th){let d=((th-3*Math.PI/4)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);if(d>Math.PI)d-=2*Math.PI;return 9.2+7.6*Math.exp(-(d*d)/(0.55*0.55));}
const palettes={
  ihram:[0xf7f7f4,0xf2f1ec,0xfbfbf8],
  abaya:[0x151515,0x1f1f22,0x2a2a2e,0x3b3631],
  other:[0xb8a58a,0x8c8f94,0x5a6d8a,0x6f8a6a,0xd8cdb8,0x9b7f6a]
};
const scarf=[0x111111,0xf0efe9,0xe6c84a,0x7ea3c9,0x9db69a,0xcdb79e,0xe2a7b1];
const skin=[0x8d5a3b,0xb07a55,0xd2a07a,0x6b4228,0xe0b896];
function pick(a){return a[(Math.random()*a.length)|0];}
function buildCrowd(){
  [bodyMesh,headMesh,headCover].forEach(m=>{if(m){scene.remove(m);m.geometry.dispose();}});
  N=Math.round((isSmall?850:1500)*crowdMul);
  const bg=new THREE.CylinderGeometry(.2,.29,1.42,8);bg.translate(0,.71,0);
  const hg=new THREE.SphereGeometry(.115,8,6);
  const cg=new THREE.SphereGeometry(.135,8,6,0,Math.PI*2,0,Math.PI*.62);
  const mat=new THREE.MeshLambertMaterial();
  bodyMesh=new THREE.InstancedMesh(bg,mat,N);headMesh=new THREE.InstancedMesh(hg,mat,N);headCover=new THREE.InstancedMesh(cg,mat,N);
  [bodyMesh,headMesh,headCover].forEach(m=>{m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);m.frustumCulled=false;scene.add(m);});
  agents=[];const col=new THREE.Color();
  for(let i=0;i<N;i++){
    const th=Math.random()*Math.PI*2, rm=rMin(th);
    const r=rm+(R_OUT-rm)*Math.pow(Math.random(),1.7);
    const t=Math.random(); const type=t<.5?"ihram":t<.78?"abaya":"other";
    const male=type==="ihram"?true:type==="abaya"?false:Math.random()<.4;
    const hs=(male?1.0:.93)*(0.9+Math.random()*.16);
    const crowdF=1-0.35*Math.exp(-(r-10)/9);
    agents.push({th,r,off:r-rm,v:(0.75+Math.random()*.45)*crowdF,ph:Math.random()*6.28,hs});
    bodyMesh.setColorAt(i,col.setHex(pick(palettes[type])));
    headMesh.setColorAt(i,col.setHex(pick(skin)));
    const covered=!male||Math.random()<.15;
    headCover.setColorAt(i,col.setHex(male?0xf7f7f4:pick(scarf)));
    agents[i].cover=covered;
  }
  bodyMesh.instanceColor.needsUpdate=true;headMesh.instanceColor.needsUpdate=true;headCover.instanceColor.needsUpdate=true;
}
const dummy=new THREE.Object3D(), hid=new THREE.Matrix4().makeScale(0,0,0);
function updateCrowd(dt,t){
  const cx=rig.position.x,cz=rig.position.z;
  for(let i=0;i<N;i++){const a=agents[i];
    a.th+=a.v/a.r*dt; if(a.th>Math.PI*2)a.th-=Math.PI*2;
    const rm=rMin(a.th); a.r+= ((rm+a.off)-a.r)*Math.min(1,dt*.6);
    // keep clear of Maqam Ibrahim
    const dth=Math.atan2(Math.sin(a.th-MQ.th),Math.cos(a.th-MQ.th));
    if(Math.abs(dth)<.1&&Math.abs(a.r-MQ.r)<1.9){a.r=a.r<MQ.r?MQ.r-1.9:MQ.r+1.9;}
    let x=Math.cos(a.th)*a.r, z=-Math.sin(a.th)*a.r;
    const dx=x-cx,dz=z-cz,d2=dx*dx+dz*dz;
    if(d2<.85){const d=Math.sqrt(d2)||.01;x=cx+dx/d*.92;z=cz+dz/d*.92;a.r=Math.hypot(x,z);a.off=a.r-rm;}
    const step=t*a.v*5+a.ph;
    dummy.position.set(x+Math.sin(step*.5)*.03,Math.abs(Math.sin(step))*.035,z);
    dummy.rotation.set(0,a.th,Math.sin(step)*.025);
    dummy.scale.set(1,a.hs,1);dummy.updateMatrix();bodyMesh.setMatrixAt(i,dummy.matrix);
    dummy.position.y+=1.53*a.hs;dummy.scale.set(1,1,1);dummy.updateMatrix();headMesh.setMatrixAt(i,dummy.matrix);
    if(a.cover){dummy.position.y+=.015;dummy.updateMatrix();headCover.setMatrixAt(i,dummy.matrix);}else headCover.setMatrixAt(i,hid);
  }
  bodyMesh.instanceMatrix.needsUpdate=headMesh.instanceMatrix.needsUpdate=headCover.instanceMatrix.needsUpdate=true;
}

const J={
 bm:[
  {b:[],t:"SIMULASI UMRAH: Niat hingga Tahallul V1",h:`<p>Langkah demi langkah mengikut nota bimbingan Lembaga Tabung Haji (mazhab Syafi'i), dengan simulasi tawaf dan sa'ie.</p>
   <h3>5 Rukun umrah</h3><ol><li>Niat ihram umrah</li><li>Tawaf umrah</li><li>Sa'ie</li><li>Bercukur atau bergunting</li><li>Tertib pada semua rukun</li></ol>
   <h3>2 Wajib umrah</h3><ol><li>Niat ihram umrah di miqat</li><li>Meninggalkan larangan ihram</li></ol>
   <p>Rukun tidak boleh ditinggalkan dan tidak boleh diganti dengan dam; tanpanya umrah tidak sempurna. Jika wajib ditinggalkan, umrah tetap sah tetapi dikenakan dam.</p>
   <p class="src">Sumber: <a href="${SRC_TH}" target="_blank" rel="noopener">Nota Kursus Asas Haji 1446H, Minggu 10: Ibadat Umrah (Tabung Haji)</a>; <a href="${SRC_MUFTI}" target="_blank" rel="noopener">Bayan Li al-Haj #30: Pengertian Tahallul (Pejabat Mufti Wilayah Persekutuan)</a>.</p>`},
  {b:["sunat"],t:"1. Persediaan sebelum ihram",h:`<ul><li>Kerat kuku, rapikan misai dan rambut, buang bulu ketiak dan ari-ari.</li><li>Mandi sunat ihram dan ambil wuduk.</li><li>Pakai minyak rambut atau wangian pada badan sebelum berniat (tidak pada kain ihram).</li><li><b>Lelaki:</b> dua helai kain tidak berjahit dan tidak bercantum; sehelai menutup pusat hingga lutut, sehelai lagi sebagai selendang. Sunat berwarna putih.</li><li><b>Lelaki:</b> selipar atau sandal mesti menampakkan tumit dan sekurang-kurangnya hujung tiga jari kaki (Muzakarah Haji Peringkat Kebangsaan ke-39).</li><li><b>Wanita:</b> pakaian menutup aurat kecuali muka dan kedua-dua tangan hingga pergelangan; tiada pakaian khusus. Elak pakaian jarang atau menampakkan bentuk badan.</li><li>Solat sunat ihram 2 rakaat.</li></ul>`},
  {b:["rukun","Rukun 1","wajib","Wajib 1"],t:"2. Niat ihram umrah di miqat",h:`<p>Niat ialah rukun; berniat di miqat (atau sebelum melintasinya) ialah wajib. Sunat menghadap kiblat dan dalam keadaan berwuduk.</p>
   <h3>Miqat</h3><ul><li><b>Qarn al-Manazil</b> bagi yang datang dari arah Asia. Jika terbang terus ke Jeddah, berniat dalam pesawat sebelum melintasi miqat mengikut makluman krew dan mutawwif.</li><li><b>Bi'r Ali</b> bagi yang datang dari Madinah.</li><li>Jika sudah berada di Makkah: keluar ke Tanah Halal seperti Tan'im, Ji'ranah atau Hudaibiyyah.</li></ul>
   <h3>Lafaz niat (hadirkan dalam hati)</h3>${LAF(NIAT_AR,"Nawaitul-'umrata wa ahramtu biha lillahi ta'ala","Sahaja aku mengerjakan umrah dan aku berihram dengannya kerana Allah Ta'ala.")}
   <h3>Niat bersyarat (jika bimbang terhalang)</h3><p>Contoh: “Sahaja aku mengerjakan umrah dan aku berihram dengannya kerana Allah Ta'ala, sekiranya aku terhalang oleh haid, ketika itu aku menjadi halal.” Ia tidak terhad kepada haid; boleh juga kerana sakit atau halangan lain.</p>
   <h3>Talbiah: sunat dari niat hingga mula tawaf</h3>${LAF(TALBIAH_AR,TALBIAH_TR,"HambaMu datang menyahut panggilanMu ya Allah. Tiada sekutu bagiMu. Segala puji, nikmat dan kerajaan adalah milikMu.")}
   <button class="act" data-act="niat">Saya telah berniat ihram umrah</button>`},
  {b:["wajib","Wajib 2"],t:"3. Larangan ihram (13 perkara)",h:`<p>Wajib dijaga dari saat berniat hingga selesai bercukur atau bergunting.</p>
   <h3>Jenis taraffuh (berseronok / berhias)</h3><ol><li>Menutup kepala atau sebahagiannya (lelaki)</li><li>Memakai pakaian bersarung, berjahit atau bercantum (lelaki)</li><li>Menutup muka (wanita)</li><li>Memakai sarung tangan</li><li>Memakai bau-bauan pada badan atau pakaian</li><li>Memakai minyak di kepala atau janggut</li><li>Muqaddimah jima'</li><li>Bersetubuh</li><li>Berkahwin, mengahwinkan atau menerima wakil kahwin</li></ol>
   <p><b>Hukum:</b> sengaja: berdosa dan dikenakan dam. Tidak sengaja atau jahil: tidak berdosa dan tidak dikenakan dam. Nikah dalam ihram tidak sah.</p>
   <h3>Jenis itlaf (menghilang / merosak)</h3><ol start="10"><li>Menanggalkan rambut atau bulu</li><li>Mengerat atau memotong kuku</li><li>Memburu atau membunuh binatang buruan</li><li>Menebang atau mencabut pokok di Tanah Haram</li></ol>
   <p><b>Hukum:</b> sengaja: berdosa dan dikenakan dam. Tidak sengaja atau jahil: tidak berdosa tetapi tetap dikenakan dam.</p>
   <p class="src">Kesalahan berat seperti bersetubuh mempunyai hukum dam yang khusus; rujuk pembimbing ibadah anda.</p>`},
  {b:["rukun","Rukun 2"],t:"4. Tawaf umrah",h:`<p>Mengelilingi Kaabah 7 pusingan, bermula dan berakhir di sudut Hajar Aswad.</p>
   <h3>Syarat sah tawaf</h3><ol><li>Menutup aurat</li><li>Suci daripada hadas besar dan kecil</li><li>Suci badan, pakaian dan tempat tawaf daripada najis</li><li>Bermula dan berakhir di sudut Hajar Aswad</li><li>Baitullah di sebelah kiri dan berjalan ke hadapan</li><li>Cukup 7 pusingan dengan yakin</li><li>Dalam Masjidil Haram dan di luar Kaabah, termasuk di luar Hijr Ismail dan Syazarwan</li><li>Mengekalkan niat tawaf</li></ol>
   <h3>Amalan sunat</h3><ul><li>Istilam ke arah Hajar Aswad sambil bertakbir; isyarat ke Rukun Yamani tanpa mengucup tapak tangan.</li><li>Lelaki: idtiba' (bahu kanan terbuka) dan berlari-lari anak (ramal) pada 3 pusingan pertama, bagi tawaf yang diikuti sa'ie.</li><li>Berzikir, berdoa, membaca al-Quran, khusyuk dan berturut-turut.</li></ul>
   <button class="act" data-act="tawaf">Masuk simulasi tawaf</button>`},
  {b:["sunat"],t:"5. Selepas tawaf",h:`<ul><li>Tutup semula bahu kanan (idtiba' tidak disunatkan ketika solat).</li><li>Solat sunat tawaf 2 rakaat, di belakang Maqam Ibrahim jika mampu, atau di mana-mana dalam Masjidil Haram jika sesak.</li><li>Minum air zamzam dan berdoa.</li><li>Terus ke tempat sa'ie; sunat masuk melalui pintu Safa (Bab al-Safa) dan bersa'ie sejurus selepas tawaf.</li></ul>`},
  {b:["rukun","Rukun 3"],t:"6. Sa'ie antara Safa dan Marwah",h:`<p>Berjalan ulang-alik antara Bukit Safa dan Bukit Marwah. Safa ke Marwah dikira 1, Marwah ke Safa dikira 2, dan seterusnya.</p>
   <h3>Syarat sah sa'ie</h3><ol><li>Dilakukan selepas tawaf umrah</li><li>Bermula dari Safa dan berakhir di Marwah</li><li>Cukup 7 kali dengan yakin</li><li>Sampai ke penghujung tempat sa'ie di kaki Safa dan Marwah pada setiap perjalanan</li><li>Dalam kawasan sa'ie (Mas'a)</li><li>Mengekalkan niat sa'ie</li></ol>
   <h3>Amalan sunat</h3><ul><li>Berwuduk dan berturut-turut.</li><li>Di Safa dan Marwah: menghadap Kaabah, bertakbir 3 kali, bertahlil dan berdoa. Lelaki menaiki bukit.</li><li>Lelaki: berlari-lari anak di kawasan bertanda lampu hijau, dan idtiba' pada semua perjalanan.</li></ul>
   ${LAF(SAR.dzikr[0],SAR.dzikr[1])}
   <button class="act" data-act="sai">Masuk simulasi sa'ie</button>`},
  {b:["rukun","Rukun 4"],t:"7. Tahallul: bercukur atau bergunting",h:`<p>Menghilangkan sekurang-kurangnya <b>3 helai rambut di kepala</b>, selepas sa'ie.</p>
   <ul><li><b>Lelaki:</b> afdal bercukur; bergunting juga sah.</li><li><b>Wanita:</b> memadai bergunting sekadar seruas jari, walaupun di hujung rambut.</li><li>Jika tiada rambut: lalukan pisau cukur di kepala.</li></ul>
   <p>Bagi umrah, sebaik sahaja bercukur atau bergunting, jemaah bebas daripada semua larangan ihram (Pejabat Mufti Wilayah Persekutuan).</p>
   <h3>Cuba: gunting 3 helai rambut</h3><div class="cut" id="cutzone">${[0,1,2].map(i=>`<button class="strand" data-act="cut" aria-label="Helai ${i+1}"><svg viewBox="0 0 30 90" width="30" height="90"><path d="M15 88 C 4 64, 26 46, 13 24 S 18 6, 15 2" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>`).join("")}</div><p id="cutmsg" class="cutmsg"></p>`},
  {b:["rukun","Rukun 5"],t:"8. Tertib: umrah selesai",h:`<p>Tertib bermaksud semua rukun dibuat mengikut susunan: yang dahulu didahulukan, yang kemudian dikemudiankan.</p>
   <ol class="tl"><li>Niat ihram umrah (di miqat)</li><li>Tawaf umrah</li><li>Sa'ie</li><li>Bercukur atau bergunting</li></ol>
   <p>Selepas tahallul, larangan ihram terangkat. Sebelum meninggalkan Makkah (contohnya pulang ke tanah air atau ke Madinah), Tawaf Wada' adalah wajib, dan umrah mesti disempurnakan sebelum Tawaf Wada'.</p>
   <p class="src">Simulasi ini ialah alat latihan visual. Untuk kemusykilan hukum, rujuk pembimbing ibadah bertauliah, Tabung Haji (03-6207 1919) atau Pejabat Mufti negeri anda.</p>
   <p class="src">Sumber: <a href="${SRC_TH}" target="_blank" rel="noopener">TH Nota KAH 1446H M10: Ibadat Umrah</a>; <a href="${SRC_TH4}" target="_blank" rel="noopener">TH Nota KAH 1446H M4: Sa'ie, Bercukur dan Tertib</a>; <a href="${SRC_MUFTI}" target="_blank" rel="noopener">Mufti WP: Pengertian Tahallul</a>.</p>`}
 ],
 en:[
  {b:[],t:"UMRAH SIMULATION: Intention to Tahallul V1",h:`<p>Step by step, following Lembaga Tabung Haji's course notes (Shafi'i school), with tawaf and sa'i simulations.</p>
   <h3>5 pillars (rukun) of umrah</h3><ol><li>Intention of ihram for umrah</li><li>Tawaf of umrah</li><li>Sa'i</li><li>Shaving or cutting the hair</li><li>Correct order of all pillars</li></ol>
   <h3>2 obligations (wajib)</h3><ol><li>Making the intention at the miqat</li><li>Avoiding the prohibitions of ihram</li></ol>
   <p>A pillar cannot be skipped or replaced by dam; without it the umrah is incomplete. If an obligation is missed, the umrah is valid but dam is due.</p>
   <p class="src">Sources: <a href="${SRC_TH}" target="_blank" rel="noopener">Basic Hajj Course Notes 1446H, Week 10: Umrah (Tabung Haji)</a>; <a href="${SRC_MUFTI}" target="_blank" rel="noopener">Bayan Li al-Haj #30: The Meaning of Tahallul (Federal Territory Mufti Office)</a>.</p>`},
  {b:["sunat"],t:"1. Preparing for ihram",h:`<ul><li>Trim nails, moustache and hair; remove armpit and pubic hair.</li><li>Take the sunnah bath for ihram and make wudu'.</li><li>Use hair oil or perfume on the body before the intention (not on the ihram cloth).</li><li><b>Men:</b> two unstitched, unjoined sheets, one from navel to knee and one over the shoulders; white is sunnah.</li><li><b>Men:</b> sandals must show the heel and at least the tips of three toes (39th National Hajj Muzakarah).</li><li><b>Women:</b> clothing covering the aurah except the face and hands to the wrists; no special garment. Avoid sheer or tight clothing.</li><li>Pray 2 rak'ahs sunnah of ihram.</li></ul>`},
  {b:["rukun","Pillar 1","wajib","Wajib 1"],t:"2. Intention of ihram at the miqat",h:`<p>The intention is a pillar; making it at (or before) the miqat is wajib. Face the qibla and be in wudu' (sunnah).</p>
   <h3>Miqat</h3><ul><li><b>Qarn al-Manazil</b> for those coming from Asia. On a direct flight to Jeddah, make the intention in the aircraft before crossing the miqat, following the crew and mutawwif.</li><li><b>Bi'r Ali</b> for those coming from Madinah.</li><li>If already in Makkah: go out to the Tanah Halal, e.g. Tan'im, Ji'ranah or Hudaibiyyah.</li></ul>
   <h3>Words of intention (held in the heart)</h3>${LAF(NIAT_AR,"Nawaitul-'umrata wa ahramtu biha lillahi ta'ala","I intend umrah and enter ihram for it for the sake of Allah Ta'ala.")}
   <h3>Conditional intention (if you fear being prevented)</h3><p>Example: “I intend umrah and enter ihram for it for the sake of Allah; if I am prevented by menstruation, I am released at that point.” It is not limited to menstruation; illness or other obstacles also apply.</p>
   <h3>Talbiyah: sunnah from the intention until tawaf begins</h3>${LAF(TALBIAH_AR,TALBIAH_TR,"Here I am, O Allah, here I am. You have no partner. All praise, blessings and dominion are Yours.")}
   <button class="act" data-act="niat">I have made the intention of ihram</button>`},
  {b:["wajib","Wajib 2"],t:"3. Prohibitions of ihram (13)",h:`<p>Must be observed from the intention until the hair is shaved or cut.</p>
   <h3>Taraffuh type (comfort / adornment)</h3><ol><li>Covering the head or part of it (men)</li><li>Wearing stitched, fitted or joined clothing (men)</li><li>Covering the face (women)</li><li>Wearing gloves</li><li>Perfume on body or clothing</li><li>Oil on the head or beard</li><li>Foreplay</li><li>Intercourse</li><li>Marrying, marrying someone off, or acting as a marriage agent</li></ol>
   <p><b>Ruling:</b> deliberate: sinful and dam is due. Unintentional or out of ignorance: no sin and no dam. A marriage contract in ihram is invalid.</p>
   <h3>Itlaf type (removing / destroying)</h3><ol start="10"><li>Removing hair</li><li>Cutting nails</li><li>Hunting or killing game</li><li>Cutting or uprooting plants in the Haram</li></ol>
   <p><b>Ruling:</b> deliberate: sinful and dam is due. Unintentional or out of ignorance: no sin, but dam is still due.</p>
   <p class="src">Serious violations such as intercourse carry specific rulings; consult your ibadah guide.</p>`},
  {b:["rukun","Pillar 2"],t:"4. Tawaf of umrah",h:`<p>Circling the Kaaba 7 times, starting and ending at the Black Stone corner.</p>
   <h3>Conditions of a valid tawaf</h3><ol><li>Covering the aurah</li><li>Free from major and minor hadath</li><li>Body, clothing and place free of najis</li><li>Start and end at the Black Stone corner</li><li>Kaaba on your left, walking forward</li><li>Complete 7 circuits with certainty</li><li>Inside Masjid al-Haram and outside the Kaaba, including outside Hijr Ismail and the Shadharwan</li><li>Maintain the intention of tawaf</li></ol>
   <h3>Sunnah acts</h3><ul><li>Istilam towards the Black Stone with takbir; gesture to Rukn al-Yamani without kissing the hand.</li><li>Men: idtiba' and raml in the first 3 circuits, for a tawaf followed by sa'i.</li><li>Dhikr, du'a, Quran, humility and continuity.</li></ul>
   <button class="act" data-act="tawaf">Enter the tawaf simulation</button>`},
  {b:["sunat"],t:"5. After tawaf",h:`<ul><li>Cover the right shoulder again (idtiba' is not sunnah in prayer).</li><li>Pray 2 rak'ahs of tawaf, behind Maqam Ibrahim if possible, or anywhere in the mosque if crowded.</li><li>Drink zamzam and make du'a.</li><li>Go to the sa'i area; it is sunnah to enter through Bab al-Safa and begin sa'i straight after tawaf.</li></ul>`},
  {b:["rukun","Pillar 3"],t:"6. Sa'i between Safa and Marwah",h:`<p>Walking back and forth between Safa and Marwah. Safa to Marwah counts as 1, Marwah to Safa as 2, and so on.</p>
   <h3>Conditions of a valid sa'i</h3><ol><li>Performed after the tawaf of umrah</li><li>Starts at Safa and ends at Marwah</li><li>7 laps with certainty</li><li>Reach the very end at Safa and Marwah on every lap</li><li>Within the sa'i area (Mas'a)</li><li>Maintain the intention of sa'i</li></ol>
   <h3>Sunnah acts</h3><ul><li>Be in wudu' and keep the laps continuous.</li><li>At Safa and Marwah: face the Kaaba, takbir 3 times, tahlil and du'a. Men climb the hill.</li><li>Men: trot between the green lights, and idtiba' on all laps.</li></ul>
   ${LAF(SAR.dzikr[0],SAR.dzikr[1])}
   <button class="act" data-act="sai">Enter the sa'i simulation</button>`},
  {b:["rukun","Pillar 4"],t:"7. Tahallul: shaving or cutting",h:`<p>Remove at least <b>3 hairs from the head</b>, after sa'i.</p>
   <ul><li><b>Men:</b> shaving is better; cutting is valid.</li><li><b>Women:</b> cutting a fingertip's length is enough, even from the ends.</li><li>If bald: pass the razor over the head.</li></ul>
   <p>For umrah, once the hair is shaved or cut, the pilgrim is released from all prohibitions of ihram (Federal Territory Mufti Office).</p>
   <h3>Try it: cut 3 hairs</h3><div class="cut" id="cutzone">${[0,1,2].map(i=>`<button class="strand" data-act="cut" aria-label="Hair ${i+1}"><svg viewBox="0 0 30 90" width="30" height="90"><path d="M15 88 C 4 64, 26 46, 13 24 S 18 6, 15 2" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>`).join("")}</div><p id="cutmsg" class="cutmsg"></p>`},
  {b:["rukun","Pillar 5"],t:"8. Order: umrah complete",h:`<p>Tartib means every pillar is done in its set order: what comes first is done first.</p>
   <ol class="tl"><li>Intention of ihram (at the miqat)</li><li>Tawaf of umrah</li><li>Sa'i</li><li>Shaving or cutting</li></ol>
   <p>After tahallul the prohibitions of ihram are lifted. Before leaving Makkah (e.g. going home or to Madinah), Tawaf al-Wada' is wajib, and the umrah must be completed before it.</p>
   <p class="src">This simulation is a visual training aid. For rulings, consult an accredited ibadah guide, Tabung Haji (+603-6207 1919) or your state Mufti office.</p>
   <p class="src">Sources: <a href="${SRC_TH}" target="_blank" rel="noopener">TH KAH 1446H Notes, Week 10: Umrah</a>; <a href="${SRC_TH4}" target="_blank" rel="noopener">TH KAH 1446H Notes, Week 4: Sa'i, Shaving and Order</a>; <a href="${SRC_MUFTI}" target="_blank" rel="noopener">Federal Territory Mufti: Meaning of Tahallul</a>.</p>`}
 ] ,id:[
  {b:[],t:"SIMULASI UMRAH: Niat hingga Tahallul V1",h:`<p>Langkah demi langkah mengikuti catatan bimbingan Lembaga Tabung Haji Malaysia (mazhab Syafi'i), dengan simulasi tawaf dan sa'i.</p>
   <h3>5 Rukun umrah</h3><ol><li>Niat ihram umrah</li><li>Tawaf umrah</li><li>Sa'i</li><li>Mencukur atau menggunting rambut</li><li>Tertib pada semua rukun</li></ol>
   <h3>2 Wajib umrah</h3><ol><li>Niat ihram umrah di miqat</li><li>Menjauhi larangan ihram</li></ol>
   <p>Rukun tidak boleh ditinggalkan dan tidak dapat diganti dengan dam; tanpanya umrah tidak sempurna. Jika wajib ditinggalkan, umrah tetap sah tetapi dikenakan dam.</p>
   <p class="src">Sumber: <a href="${SRC_TH}" target="_blank" rel="noopener">Catatan Kursus Asas Haji 1446H, Minggu 10: Ibadah Umrah (Tabung Haji)</a>; <a href="${SRC_MUFTI}" target="_blank" rel="noopener">Bayan Li al-Haj #30: Pengertian Tahallul (Kantor Mufti Wilayah Persekutuan)</a>.</p>`},
  {b:["sunat"],t:"1. Persiapan sebelum ihram",h:`<ul><li>Memotong kuku, merapikan kumis dan rambut, mencabut bulu ketiak dan mencukur bulu kemaluan.</li><li>Mandi sunah ihram dan berwudu.</li><li>Memakai minyak rambut atau wewangian di badan sebelum berniat (tidak pada kain ihram).</li><li><b>Laki-laki:</b> dua helai kain tidak berjahit dan tidak tersambung; satu menutup pusar hingga lutut, satu lagi diselendangkan. Disunahkan berwarna putih.</li><li><b>Laki-laki:</b> sandal harus memperlihatkan tumit dan sekurang-kurangnya ujung tiga jari kaki (Muzakarah Haji Nasional Malaysia ke-39).</li><li><b>Perempuan:</b> pakaian menutup aurat kecuali wajah dan kedua tangan hingga pergelangan; tidak ada pakaian khusus. Hindari pakaian tipis atau ketat.</li><li>Salat sunah ihram 2 rakaat.</li></ul>`},
  {b:["rukun","Rukun 1","wajib","Wajib 1"],t:"2. Niat ihram umrah di miqat",h:`<p>Niat adalah rukun; berniat di miqat (atau sebelum melewatinya) adalah wajib. Disunahkan menghadap kiblat dan dalam keadaan berwudu.</p>
   <h3>Miqat</h3><ul><li><b>Qarn al-Manazil</b> bagi yang datang dari arah Asia. Jika terbang langsung ke Jeddah, berniatlah di dalam pesawat sebelum melewati miqat sesuai pengumuman awak kabin dan pembimbing.</li><li><b>Bir Ali</b> bagi yang datang dari Madinah.</li><li>Jika sudah berada di Makkah: keluar ke Tanah Halal seperti Tan'im, Ji'ranah atau Hudaibiyah.</li></ul>
   <h3>Lafaz niat (hadirkan dalam hati)</h3>${LAF(NIAT_AR,"Nawaitul-'umrata wa ahramtu biha lillahi ta'ala","Aku berniat umrah dan berihram dengannya karena Allah Ta'ala.")}
   <h3>Niat bersyarat (jika khawatir terhalang)</h3><p>Contoh: “Aku berniat umrah dan berihram dengannya karena Allah Ta'ala; jika aku terhalang oleh haid, maka saat itu aku menjadi halal.” Tidak terbatas pada haid; boleh juga karena sakit atau halangan lain.</p>
   <h3>Talbiyah: sunah sejak niat hingga mulai tawaf</h3>${LAF(TALBIAH_AR,TALBIAH_TR,"Aku penuhi panggilan-Mu ya Allah. Tiada sekutu bagi-Mu. Segala puji, nikmat dan kerajaan adalah milik-Mu.")}
   <button class="act" data-act="niat">Saya sudah berniat ihram umrah</button>`},
  {b:["wajib","Wajib 2"],t:"3. Larangan ihram (13 perkara)",h:`<p>Wajib dijaga sejak berniat hingga selesai mencukur atau menggunting rambut.</p>
   <h3>Jenis taraffuh (bersenang-senang / berhias)</h3><ol><li>Menutup kepala atau sebagiannya (laki-laki)</li><li>Memakai pakaian berjahit, bersarung atau tersambung (laki-laki)</li><li>Menutup wajah (perempuan)</li><li>Memakai sarung tangan</li><li>Memakai wewangian pada badan atau pakaian</li><li>Memakai minyak di kepala atau janggut</li><li>Pendahuluan jimak</li><li>Bersetubuh</li><li>Menikah, menikahkan atau menjadi wakil nikah</li></ol>
   <p><b>Hukum:</b> sengaja: berdosa dan dikenakan dam. Tidak sengaja atau tidak tahu: tidak berdosa dan tidak dikenakan dam. Akad nikah dalam ihram tidak sah.</p>
   <h3>Jenis itlaf (menghilangkan / merusak)</h3><ol start="10"><li>Menghilangkan rambut atau bulu</li><li>Memotong kuku</li><li>Berburu atau membunuh binatang buruan</li><li>Menebang atau mencabut pohon di Tanah Haram</li></ol>
   <p><b>Hukum:</b> sengaja: berdosa dan dikenakan dam. Tidak sengaja atau tidak tahu: tidak berdosa tetapi tetap dikenakan dam.</p>
   <p class="src">Pelanggaran berat seperti bersetubuh memiliki hukum dam khusus; tanyakan kepada pembimbing ibadah Anda.</p>`},
  {b:["rukun","Rukun 2"],t:"4. Tawaf umrah",h:`<p>Mengelilingi Ka'bah 7 putaran, dimulai dan diakhiri di sudut Hajar Aswad.</p>
   <h3>Syarat sah tawaf</h3><ol><li>Menutup aurat</li><li>Suci dari hadas besar dan kecil</li><li>Badan, pakaian dan tempat tawaf suci dari najis</li><li>Dimulai dan diakhiri di sudut Hajar Aswad</li><li>Ka'bah di sebelah kiri dan berjalan ke depan</li><li>Genap 7 putaran dengan yakin</li><li>Di dalam Masjidil Haram dan di luar Ka'bah, termasuk di luar Hijr Ismail dan Syadzarwan</li><li>Menjaga niat tawaf</li></ol>
   <h3>Amalan sunah</h3><ul><li>Istilam ke arah Hajar Aswad sambil bertakbir; berisyarat ke Rukun Yamani tanpa mencium telapak tangan.</li><li>Laki-laki: idtiba' (bahu kanan terbuka) dan raml pada 3 putaran pertama, untuk tawaf yang diikuti sa'i.</li><li>Berzikir, berdoa, membaca Al-Qur'an, khusyuk dan berturut-turut.</li></ul>
   <button class="act" data-act="tawaf">Masuk simulasi tawaf</button>`},
  {b:["sunat"],t:"5. Setelah tawaf",h:`<ul><li>Tutup kembali bahu kanan (idtiba' tidak disunahkan saat salat).</li><li>Salat sunah tawaf 2 rakaat, di belakang Maqam Ibrahim jika mampu, atau di mana saja di Masjidil Haram jika padat.</li><li>Minum air zamzam dan berdoa.</li><li>Langsung menuju tempat sa'i; disunahkan masuk melalui pintu Shafa (Bab ash-Shafa) dan bersa'i segera setelah tawaf.</li></ul>`},
  {b:["rukun","Rukun 3"],t:"6. Sa'i antara Shafa dan Marwah",h:`<p>Berjalan bolak-balik antara Bukit Shafa dan Bukit Marwah. Shafa ke Marwah dihitung 1, Marwah ke Shafa dihitung 2, dan seterusnya.</p>
   <h3>Syarat sah sa'i</h3><ol><li>Dilakukan setelah tawaf umrah</li><li>Dimulai dari Shafa dan diakhiri di Marwah</li><li>Genap 7 kali dengan yakin</li><li>Sampai ke ujung tempat sa'i di kaki Shafa dan Marwah pada setiap perjalanan</li><li>Di dalam area sa'i (Mas'a)</li><li>Menjaga niat sa'i</li></ol>
   <h3>Amalan sunah</h3><ul><li>Berwudu dan berturut-turut.</li><li>Di Shafa dan Marwah: menghadap Ka'bah, bertakbir 3 kali, bertahlil dan berdoa. Laki-laki naik ke bukit.</li><li>Laki-laki: berlari kecil di area bertanda lampu hijau, dan idtiba' pada semua perjalanan.</li></ul>
   ${LAF(SAR.dzikr[0],SAR.dzikr[1])}
   <button class="act" data-act="sai">Masuk simulasi sa'i</button>`},
  {b:["rukun","Rukun 4"],t:"7. Tahallul: mencukur atau menggunting",h:`<p>Menghilangkan sekurang-kurangnya <b>3 helai rambut kepala</b>, setelah sa'i.</p>
   <ul><li><b>Laki-laki:</b> lebih utama mencukur; menggunting juga sah.</li><li><b>Perempuan:</b> cukup menggunting sepanjang satu ruas jari, walaupun di ujung rambut.</li><li>Jika tidak berambut: lewatkan pisau cukur di kepala.</li></ul>
   <p>Untuk umrah, begitu mencukur atau menggunting rambut, jemaah bebas dari semua larangan ihram (Kantor Mufti Wilayah Persekutuan).</p>
   <h3>Coba: gunting 3 helai rambut</h3>${STRANDS("Helai")}`},
  {b:["rukun","Rukun 5"],t:"8. Tertib: umrah selesai",h:`<p>Tertib berarti semua rukun dikerjakan sesuai urutan: yang dahulu didahulukan, yang kemudian diakhirkan.</p>
   <ol class="tl"><li>Niat ihram umrah (di miqat)</li><li>Tawaf umrah</li><li>Sa'i</li><li>Mencukur atau menggunting</li></ol>
   <p>Setelah tahallul, larangan ihram terangkat. Sebelum meninggalkan Makkah (misalnya pulang ke tanah air atau ke Madinah), Tawaf Wada' wajib dilakukan, dan umrah harus disempurnakan sebelum Tawaf Wada'.</p>
   <p class="src">Simulasi ini adalah alat latihan visual. Untuk persoalan hukum, rujuklah pembimbing ibadah resmi di negara Anda.</p>
   <p class="src">Sumber: <a href="${SRC_TH}" target="_blank" rel="noopener">TH Catatan KAH 1446H M10: Ibadah Umrah</a>; <a href="${SRC_TH4}" target="_blank" rel="noopener">TH Catatan KAH 1446H M4: Sa'i, Bercukur dan Tertib</a>; <a href="${SRC_MUFTI}" target="_blank" rel="noopener">Mufti WP: Pengertian Tahallul</a>.</p>`}
 ]
 ,ar:[
  {b:[],t:"محاكاة العمرة: من النية إلى التحلل V1",h:`<p>خطوة بخطوة وفق مذكرات التوجيه الصادرة عن هيئة صندوق الحج الماليزية (تابونغ حاجي) على المذهب الشافعي، مع محاكاة للطواف والسعي.</p>
   <h3>أركان العمرة الخمسة</h3><ol><li>نية الإحرام بالعمرة</li><li>طواف العمرة</li><li>السعي</li><li>الحلق أو التقصير</li><li>الترتيب بين الأركان</li></ol>
   <h3>واجبا العمرة</h3><ol><li>الإحرام من الميقات</li><li>اجتناب محظورات الإحرام</li></ol>
   <p>الركن لا يجوز تركه ولا يُجبر بدم، ولا تتم العمرة بدونه. أما الواجب فإن تُرك صحت العمرة ولزم الدم.</p>
   <p class="src">المصادر: <a href="${SRC_TH}" target="_blank" rel="noopener">مذكرات الدورة الأساسية للحج 1446هـ، الأسبوع 10: العمرة (تابونغ حاجي)</a>؛ <a href="${SRC_MUFTI}" target="_blank" rel="noopener">بيان لِلحج رقم 30: معنى التحلل (مكتب مفتي الأقاليم الاتحادية)</a>.</p>`},
  {b:["sunat"],t:"1. الاستعداد قبل الإحرام",h:`<ul><li>تقليم الأظفار، وتهذيب الشارب والشعر، ونتف الإبط وحلق العانة.</li><li>الاغتسال للإحرام والوضوء.</li><li>تطييب البدن أو دهن الشعر قبل النية (لا على ثوب الإحرام).</li><li><b>الرجل:</b> إزار ورداء غير مخيطين ولا متصلين؛ الإزار من السرة إلى الركبة، والرداء على الكتفين، ويُسن أن يكونا أبيضين.</li><li><b>الرجل:</b> النعل يُظهر العقب وأطراف ثلاثة أصابع على الأقل (المذاكرة الوطنية الماليزية للحج رقم 39).</li><li><b>المرأة:</b> لباس ساتر للعورة إلا الوجه والكفين، ولا لباس مخصوص لها، وتتجنب الشفاف والضيق.</li><li>صلاة ركعتي الإحرام.</li></ul>`},
  {b:["rukun","الركن 1","wajib","الواجب 1"],t:"2. نية الإحرام بالعمرة من الميقات",h:`<p>النية ركن، وكونها من الميقات (أو قبل مجاوزته) واجب. ويُسن استقبال القبلة والطهارة.</p>
   <h3>الميقات</h3><ul><li><b>قرن المنازل</b> للقادمين من جهة آسيا، ومن سافر جوًا مباشرة إلى جدة أحرم في الطائرة قبل محاذاة الميقات حسب تنبيه الطاقم والمرشد.</li><li><b>بئر علي (ذو الحليفة)</b> للقادمين من المدينة.</li><li>من كان في مكة: يخرج إلى الحل كالتنعيم أو الجعرانة أو الحديبية.</li></ul>
   <h3>لفظ النية (مع استحضارها في القلب)</h3>${LAF(NIAT_AR,"",'')}
   <h3>الاشتراط (لمن خاف المانع)</h3><p>مثاله: «نويتُ العمرة وأحرمتُ بها لله تعالى، فإن حبسني حابس من حيض فمحلّي حيث حبستني». ولا يختص بالحيض، بل يشمل المرض وغيره من الموانع.</p>
   <h3>التلبية: سنة من الإحرام إلى بدء الطواف</h3>${LAF(TALBIAH_AR,"",'')}
   <button class="act" data-act="niat">نويتُ الإحرام بالعمرة</button>`},
  {b:["wajib","الواجب 2"],t:"3. محظورات الإحرام (13)",h:`<p>يجب اجتنابها من النية حتى الحلق أو التقصير.</p>
   <h3>محظورات الترفّه</h3><ol><li>تغطية الرأس أو بعضه (للرجل)</li><li>لبس المخيط أو المحيط (للرجل)</li><li>تغطية الوجه (للمرأة)</li><li>لبس القفازين</li><li>الطيب في البدن أو الثوب</li><li>دهن شعر الرأس أو اللحية</li><li>مقدمات الجماع</li><li>الجماع</li><li>عقد النكاح أو تولّيه أو التوكيل فيه</li></ol>
   <p><b>الحكم:</b> العامد آثم وعليه الدم، والناسي أو الجاهل لا إثم عليه ولا دم. وعقد النكاح في الإحرام باطل.</p>
   <h3>محظورات الإتلاف</h3><ol start="10"><li>إزالة الشعر</li><li>تقليم الأظفار</li><li>صيد البر أو قتله</li><li>قطع شجر الحرم أو قلعه</li></ol>
   <p><b>الحكم:</b> العامد آثم وعليه الدم، والناسي أو الجاهل لا إثم عليه لكن يلزمه الدم.</p>
   <p class="src">للمحظورات الكبرى كالجماع أحكام خاصة؛ راجع مرشدك في العبادة.</p>`},
  {b:["rukun","الركن 2"],t:"4. طواف العمرة",h:`<p>الطواف بالكعبة سبعة أشواط، يبدأ وينتهي عند ركن الحجر الأسود.</p>
   <h3>شروط صحة الطواف</h3><ol><li>ستر العورة</li><li>الطهارة من الحدثين</li><li>طهارة البدن والثوب والمكان من النجاسة</li><li>البدء والانتهاء عند ركن الحجر الأسود</li><li>جعل البيت عن يساره مع المشي إلى الأمام</li><li>إكمال سبعة أشواط يقينًا</li><li>أن يكون داخل المسجد الحرام وخارج الكعبة، ومن ذلك الحِجر والشاذروان</li><li>ألّا يصرفه لغيره</li></ol>
   <h3>من سنن الطواف</h3><ul><li>استلام الحجر الأسود أو الإشارة إليه مع التكبير، والإشارة إلى الركن اليماني دون تقبيل اليد.</li><li>للرجال: الاضطباع والرمل في الأشواط الثلاثة الأولى، في طواف يعقبه سعي.</li><li>الذكر والدعاء وقراءة القرآن، والخشوع والموالاة.</li></ul>
   <button class="act" data-act="tawaf">ادخل محاكاة الطواف</button>`},
  {b:["sunat"],t:"5. بعد الطواف",h:`<ul><li>غطِّ كتفك الأيمن (لا يُسن الاضطباع في الصلاة).</li><li>صلِّ ركعتي الطواف خلف مقام إبراهيم إن تيسّر، وإلا ففي أي مكان من المسجد الحرام.</li><li>اشرب من ماء زمزم وادعُ.</li><li>ثم توجّه إلى المسعى؛ ويُسن الخروج من باب الصفا والمبادرة إلى السعي بعد الطواف.</li></ul>`},
  {b:["rukun","الركن 3"],t:"6. السعي بين الصفا والمروة",h:`<p>المشي ذهابًا وإيابًا بين الصفا والمروة: من الصفا إلى المروة شوط، ومن المروة إلى الصفا شوط ثانٍ، وهكذا.</p>
   <h3>شروط صحة السعي</h3><ol><li>أن يكون بعد طواف العمرة</li><li>البدء بالصفا والختم بالمروة</li><li>إكمال سبعة أشواط يقينًا</li><li>استيعاب المسافة بين الصفا والمروة في كل شوط</li><li>أن يكون في المسعى</li><li>ألّا يصرفه لغيره</li></ol>
   <h3>من سنن السعي</h3><ul><li>الطهارة والموالاة.</li><li>على الصفا والمروة: استقبال الكعبة، والتكبير ثلاثًا، والتهليل، والدعاء، وصعود الرجل عليهما.</li><li>للرجال: الإسراع بين العلمين الأخضرين، والاضطباع في جميع الأشواط.</li></ul>
   ${LAF(SAR.dzikr[0],"")}
   <button class="act" data-act="sai">ادخل محاكاة السعي</button>`},
  {b:["rukun","الركن 4"],t:"7. التحلل: الحلق أو التقصير",h:`<p>إزالة <b>ثلاث شعرات من شعر الرأس</b> على الأقل بعد السعي.</p>
   <ul><li><b>الرجل:</b> الحلق أفضل، والتقصير مجزئ.</li><li><b>المرأة:</b> يكفيها التقصير قدر أنملة ولو من أطراف الشعر.</li><li>من لا شعر له: يُمِرّ الموسى على رأسه.</li></ul>
   <p>وفي العمرة يتحلل المعتمر من جميع محظورات الإحرام بمجرد الحلق أو التقصير (مكتب مفتي الأقاليم الاتحادية).</p>
   <h3>جرّب: قصّ ثلاث شعرات</h3>${STRANDS("شعرة")}`},
  {b:["rukun","الركن 5"],t:"8. الترتيب: تمت العمرة",h:`<p>الترتيب أن تُؤدّى الأركان على نسقها: يُقدَّم ما حقه التقديم ويُؤخَّر ما حقه التأخير.</p>
   <ol class="tl"><li>نية الإحرام بالعمرة (من الميقات)</li><li>طواف العمرة</li><li>السعي</li><li>الحلق أو التقصير</li></ol>
   <p>بعد التحلل ترتفع محظورات الإحرام. ومن أراد مغادرة مكة (كالعودة إلى بلده أو السفر إلى المدينة) وجب عليه طواف الوداع، ولا بد من إتمام العمرة قبله.</p>
   <p class="src">هذه المحاكاة أداة تدريب بصري. وللمسائل الفقهية راجع المرشد المعتمد أو جهة الإفتاء في بلدك.</p>
   <p class="src">المصادر: <a href="${SRC_TH}" target="_blank" rel="noopener">تابونغ حاجي، مذكرات 1446هـ، الأسبوع 10: العمرة</a>؛ <a href="${SRC_TH4}" target="_blank" rel="noopener">تابونغ حاجي، مذكرات 1446هـ، الأسبوع 4: السعي والحلق والترتيب</a>؛ <a href="${SRC_MUFTI}" target="_blank" rel="noopener">مفتي الأقاليم الاتحادية: معنى التحلل</a>.</p>`}

function setCredit(){const html=`<img class="credit-logo" src="${USM_LOGO}" alt="Universiti Sains Malaysia · APEX">`+MISC[lang].credit;document.querySelectorAll(".credit").forEach(el=>el.innerHTML=html);}
function renderJourney(){setCredit();document.title=MISC[lang].title;
  const L=JT[lang], st=J[lang][jstep], n=J[lang].length;
  $("jsteps").innerHTML=Array.from({length:n},(_,i)=>`<i class="${i<jstep?"on":i===jstep?"cur":""}"></i>`).join("");
  let bh="";for(let i=0;i<st.b.length;i++){const k=st.b[i];if(BADGE[k]){const lbl=st.b[i+1]&&!BADGE[st.b[i+1]]?st.b[++i]:L[k];bh+=`<span class="badge ${BADGE[k]}">${lbl.toUpperCase()}</span>`;}}
  $("jbadges").innerHTML=bh;$("jtitle").textContent=st.t;$("jbody").innerHTML=st.h;
  const pill=$("jstate");pill.textContent=cutN>=3?L.halal:ihram?L.inI:L.notI;pill.className="pill "+(ihram?"p-on":cutN>=3?"p-done":"");
  {const r=LANGS[lang].dir==="rtl";$("jprev").textContent=r?"› "+L.prev:"‹ "+L.prev;$("jnext").textContent=r?L.next+" ‹":L.next+" ›";}
  $("jprev").disabled=jstep===0;$("jnext").style.visibility=jstep===n-1?"hidden":"visible";
  $("jlang").value=lang;$("toGuide").textContent=MISC[lang].guideBtn;
  if(jstep===7){const btns=[...document.querySelectorAll(".strand")];btns.forEach((b,i)=>{if(i<cutN)b.classList.add("gone");});cutMsg();}
  $("jcard").scrollTop=0;
}
function cutMsg(){const m=$("cutmsg");if(!m)return;m.textContent=cutN>=3?MISC[lang].cut3:MISC[lang].cutN(cutN);}
function openJourney(i){hideHint();
  if(typeof i==="number")jstep=Math.max(0,Math.min(J.bm.length-1,i));
  playing=false;setMode("sim");activity="journey";
  if(rig.parent!==scene)scene.add(rig);
  ["hud","map","bar","intro"].forEach(id=>$(id).style.display="none");
  $("journey").style.display="grid";renderJourney();
}
$("jprev").onclick=()=>{if(jstep>0){jstep--;renderJourney();}};
$("jnext").onclick=()=>{if(jstep<J.bm.length-1){jstep++;renderJourney();}};
$("jlang").onchange=e=>setLang(e.target.value);
$("jbody").addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="niat"){ihram=true;cutN=0;flash(MISC[lang].niat);renderJourney();}
  else if(a==="tawaf"){$("journey").style.display="none";$("intro").style.display="grid";}
  else if(a==="sai"){startSai();}
  else if(a==="cut"&&!b.classList.contains("gone")){b.classList.add("gone");cutN++;if(cutN>=3){ihram=false;flash(MISC[lang].tah);renderJourney();}else cutMsg();}
});
$("toGuide").onclick=()=>openJourney(jstep);
$("guideBtn").onclick=()=>openJourney(jstep);
$("nextstep").onclick=()=>openJourney(activity==="sai"?7:5);

    const dm=new THREE.Mesh(new THREE.SphereGeometry(12,24,12,0,Math.PI*2,0,Math.PI/2),new THREE.MeshLambertMaterial({color:0xf4f1e8,side:THREE.DoubleSide}));dm.position.y=15.9;dm.scale.y=.5;g.add(dm);
    const c=document.createElement("canvas");c.width=512;c.height=128;const x=c.getContext("2d");x.fillStyle="#17894f";x.fillRect(0,0,512,128);x.fillStyle="#fff";x.font="800 64px Manrope, sans-serif";x.textAlign="center";x.fillText(label,256,88);
    const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t}));sp.scale.set(8,2,1);sp.position.set(0,11,0);g.add(sp);sScene.add(g);}
  hill(-SL/2-7,1,"AS-SAFA");hill(SL/2+7,.75,"AL-MARWAH");
})();
let sBody=null,sHead=null,sCover=null,sAg=[],SN=0;
function buildSaiCrowd(){[sBody,sHead,sCover].forEach(m=>{if(m){sScene.remove(m);m.geometry.dispose();}});
  SN=Math.round((isSmall?650:1100)*crowdMul);
  const bg=new THREE.CylinderGeometry(.2,.29,1.42,8);bg.translate(0,.71,0);const hg=new THREE.SphereGeometry(.115,8,6);const cg=new THREE.SphereGeometry(.135,8,6,0,Math.PI*2,0,Math.PI*.62);const mat=new THREE.MeshLambertMaterial();
  sBody=new THREE.InstancedMesh(bg,mat,SN);sHead=new THREE.InstancedMesh(hg,mat,SN);sCover=new THREE.InstancedMesh(cg,mat,SN);
  [sBody,sHead,sCover].forEach(m=>{m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);m.frustumCulled=false;sScene.add(m);});
  sAg=[];const col=new THREE.Color();
  for(let i=0;i<SN;i++){const dir=Math.random()<.5?1:-1;const t=Math.random();const type=t<.5?"ihram":t<.78?"abaya":"other";const male=type==="ihram"?true:type==="abaya"?false:Math.random()<.4;
    sAg.push({dir,x:-dir*(1.6+Math.random()*19),z:(Math.random()-.5)*SL,v:.9+Math.random()*.5,ph:Math.random()*6.28,hs:(male?1:.93)*(.9+Math.random()*.16),cover:!male||Math.random()<.15});
    sBody.setColorAt(i,col.setHex(pick(palettes[type])));sHead.setColorAt(i,col.setHex(pick(skin)));sCover.setColorAt(i,col.setHex(male?0xf7f7f4:pick(scarf)));}
  sBody.instanceColor.needsUpdate=sHead.instanceColor.needsUpdate=sCover.instanceColor.needsUpdate=true;}
function updateSaiCrowd(dt,t){const cx=rig.position.x,cz=rig.position.z;
  for(let i=0;i<SN;i++){const a=sAg[i];const g=(a.z>G0&&a.z<G1)?1.35:1;a.z+=a.dir*a.v*g*dt;
    if(a.z>SL/2+4){a.z=-SL/2-4;}if(a.z<-SL/2-4){a.z=SL/2+4;}
    let x=a.x;const dx=x-cx,dz=a.z-cz;if(Math.abs(dz)<.9&&Math.abs(dx)<.9){a.x+=dx>=0?.05:-.05;x=a.x;}
    const step=t*a.v*5+a.ph;dummy.position.set(x+Math.sin(step*.5)*.03,Math.abs(Math.sin(step))*.035,a.z);dummy.rotation.set(0,a.dir>0?Math.PI:0,Math.sin(step)*.025);
    dummy.scale.set(1,a.hs,1);dummy.updateMatrix();sBody.setMatrixAt(i,dummy.matrix);
    dummy.position.y+=1.53*a.hs;dummy.scale.set(1,1,1);dummy.updateMatrix();sHead.setMatrixAt(i,dummy.matrix);
    if(a.cover){dummy.position.y+=.015;dummy.updateMatrix();sCover.setMatrixAt(i,dummy.matrix);}else sCover.setMatrixAt(i,hid);}
  sBody.instanceMatrix.needsUpdate=sHead.instanceMatrix.needsUpdate=sCover.instanceMatrix.needsUpdate=true;}
const SAI_WALK=1.2,PAUSE=8;
let saiTrip=1,saiS=0,saiPause=PAUSE,saiDone=false,saiT=0,lastSaiKey="";
function saiZ(){return saiTrip%2?-SL/2+saiS:SL/2-saiS;}
function saiDir(){return saiTrip%2?1:-1;}
function placeSaiRig(){const d=saiDir();rig.position.set(d>0?-6:6,0,saiZ());rig.rotation.y=d>0?Math.PI:0;if(saiPause>0&&!saiDone){/* face back toward Kaaba side roughly */}}
function resetSai(){saiTrip=1;saiS=0;saiPause=PAUSE;saiDone=false;lastSaiKey="";yawOff=0;pitchOff=0;playing=true;buildBar();}
function startSai(){
  setMode("sim");activity="sai";sScene.add(rig);buildSaiCrowd();resetSai();
  $("journey").style.display="none";$("intro").style.display="none";["hud","map"].forEach(id=>$(id).style.display="block");$("bar").style.display="flex";
  if(!SPEEDS_SIM.includes(speed))speed=3;if(speed===1)speed=3;buildBar();showHint();
}
function updateSai(dt,sd){if(saiDone)return;
  if(saiPause>0){saiPause-=dt*(playing?Math.min(speed,4):0);return;}
  const z=saiZ();const inG=z>G0&&z<G1;let v=SAI_WALK;if(sex==="m"&&inG)v*=1.6;
  saiS+=v*sd;
  if(saiS>=SL){saiS=SL;if(saiTrip===7){saiDone=true;playing=false;flash(JT[lang].saiDone);buildBar();}else{saiTrip++;saiS=0;saiPause=PAUSE;flash(`${JT[lang].trip} ${saiTrip} / 7`);}}
}
function saiKey(){if(saiDone)return"done";if(saiPause>0)return saiTrip===1?"safa1":(saiTrip%2?"safa":"marwah");const z=saiZ();return(z>G0&&z<G1)?"green":"walk";}
function renderSaiHud(){const L=JT[lang],k=saiKey();const key=k+saiTrip+lang+sex;if(key===lastSaiKey)return;lastSaiKey=key;lastKey="";
  const dirT=saiTrip%2?L.dir1:L.dir2;
  $("lap").innerHTML=saiDone?`${L.saiDone} <small>7 / 7</small>`:`${L.trip} ${saiTrip} <small>/ 7 · ${dirT}</small>`;
  const [s,g]=L.sai[k];$("seg").textContent=s;$("guide").textContent=g;
  let ar=null;if(k==="safa1")ar=[SAR.verse[0]+"  ·  "+SAR.dzikr[0],SAR.verse[1]+" · "+SAR.dzikr[1]];else if(k==="safa"||k==="marwah")ar=SAR.dzikr;
  $("ar").textContent=ar?ar[0]:"";$("tr").textContent=ar?ar[1]:"";$("ar").style.display=$("tr").style.display=ar?"block":"none";
  $("tip").textContent=L.saiTip;
  drawPanel(saiDone?"7 / 7":`${L.trip} ${saiTrip} / 7`,s,g,ar?ar[0]:"");}
function drawSaiMap(){const w=256;mg.clearRect(0,0,w,w);const cs=getComputedStyle(document.documentElement);const ink=cs.getPropertyValue("--ink").trim(),gold=cs.getPropertyValue("--gold").trim(),green=cs.getPropertyValue("--green").trim();
  const x0=34,x1=222,y=150,X=z=>x0+(z+SL/2)/SL*(x1-x0);
  mg.strokeStyle=ink;mg.globalAlpha=.25;mg.lineWidth=14;mg.lineCap="round";mg.beginPath();mg.moveTo(x0,y);mg.lineTo(x1,y);mg.stroke();mg.globalAlpha=1;
  mg.strokeStyle=green;mg.lineWidth=14;mg.lineCap="butt";mg.beginPath();mg.moveTo(X(G0),y);mg.lineTo(X(G1),y);mg.stroke();
  mg.fillStyle="#8d7c69";mg.beginPath();mg.arc(x0,y,14,0,7);mg.fill();mg.beginPath();mg.arc(x1,y,11,0,7);mg.fill();
  mg.fillStyle=ink;mg.font="700 22px Manrope, sans-serif";mg.textAlign="center";mg.fillText("Safa",x0+6,y+46);mg.fillText("Marwah",x1-14,y+46);
  for(let i=0;i<7;i++){const bx=56+i*24,by=70;mg.beginPath();mg.arc(bx,by,9,0,7);if(i<saiTrip-1||saiDone){mg.fillStyle=gold;mg.fill();}else if(i===saiTrip-1){mg.fillStyle=green;mg.fill();}else{mg.strokeStyle=ink;mg.globalAlpha=.4;mg.lineWidth=2;mg.stroke();mg.globalAlpha=1;}}
  const px=X(saiZ());mg.fillStyle=green;mg.beginPath();mg.arc(px,y,11,0,7);mg.fill();mg.strokeStyle="#fff";mg.lineWidth=3;mg.stroke();
  mg.fillStyle=green;mg.beginPath();const d=saiDir();mg.moveTo(px+d*24,y);mg.lineTo(px+d*12,y-8);mg.lineTo(px+d*12,y+8);mg.fill();}

/* ---------- 360° look hint ---------- */
function showHint(){if(gyroOn||renderer.xr.isPresenting)return;$("hintTxt").textContent=MISC[lang].hint;$("hint").style.display="flex";clearTimeout(showHint.t);showHint.t=setTimeout(hideHint,7000);}
function hideHint(){$("hint").style.display="none";}

/* ---------- Light / dark theme ---------- */
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);
  document.querySelectorAll(".themeBtn").forEach(b=>{b.textContent=t==="dark"?"☀️":"🌙";b.title=t==="dark"?"Cerah / Light":"Gelap / Dark";});
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content",t==="dark"?"#0f3d2e":"#17894f");
  try{localStorage.setItem("su-theme",t);}catch(e){}}
(function(){let t=null;try{t=localStorage.getItem("su-theme");}catch(e){}
  if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";applyTheme(t);})();
document.querySelectorAll(".themeBtn").forEach(b=>b.onclick=()=>applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"));

renderJourney();

/* ---------- Loop ---------- */
const clock=new THREE.Clock();
placeRig();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.1);
  const simDt=dt*(playing?speed:0);
  if(activity==="sai"){updateSai(dt,simDt);saiT+=simDt||dt*.15;updateSaiCrowd(simDt||dt*.15,saiT);placeSaiRig();
    if(!renderer.xr.isPresenting){if(gyroOn)applyGyro();else camera.rotation.set(pitchOff,yawOff,0);camera.position.y=1.6+Math.abs(Math.sin(saiT*5))*.02;}
    renderSaiHud();drawSaiMap();renderer.render(sScene,camera);return;}
  if(mode!=="sim"){
    if(!finished&&realv.duration){const f=Math.min(1,realv.currentTime/realv.duration);th=(mode==="v360"&&v360Full)?TOTAL*f:(realLap-1)*Math.PI*2+Math.PI*2*f;}
    const lp=lapNum();if(lp!==lastLap&&lp>0&&!finished){flash(TXT[lang].newlap(lp));lastLap=lp;}
  } else if(playing&&!finished){
    const ramlF=(sex==="m"&&th>=0&&th<Math.PI*6)?1.25:1;
    th+=WALK*ramlF*simDt/R0;
    if(th>=TOTAL){th=TOTAL;finished=true;playing=false;buildBar();flash(TXT[lang].done);}
    const lp=lapNum();if(lp!==lastLap&&lp>0&&!finished){flash(TXT[lang].newlap(lp));lastLap=lp;}
  }
  const realFlat=mode==="real"&&!renderer.xr.isPresenting;
  simT+=simDt||dt*.15;
  if(!realFlat&&mode!=="v360")updateCrowd(mode==="real"?dt:(simDt||dt*.15),simT);
  placeRig();
  if(!renderer.xr.isPresenting){if(gyroOn)applyGyro();else{camera.rotation.set(pitchOff,yawOff,0);}camera.position.y=1.6+Math.abs(Math.sin(simT*5))*.02;}
  renderHud();drawMap();
  if(!realFlat)renderer.render(scene,camera);
});
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
})();
</script>
