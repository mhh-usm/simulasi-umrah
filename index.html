نتُمۡ صَٰدِقِينَ","مَا يَنظُرُونَ إِلَّا صَيۡحَةࣰ وَٰحِدَةࣰ تَأۡخُذُهُمۡ وَهُمۡ يَخِصِّمُونَ","فَلَا يَسۡتَطِيعُونَ تَوۡصِيَةࣰ وَلَآ إِلَىٰٓ أَهۡلِهِمۡ يَرۡجِعُونَ","وَنُفِخَ فِي ٱلصُّورِ فَإِذَا هُم مِّنَ ٱلۡأَجۡدَاثِ إِلَىٰ رَبِّهِمۡ يَنسِلُونَ","قَالُواْ يَٰوَيۡلَنَا مَنۢ بَعَثَنَا مِن مَّرۡقَدِنَاۜۗ هَٰذَا مَا وَعَدَ ٱلرَّحۡمَٰنُ وَصَدَقَ ٱلۡمُرۡسَلُونَ","إِن كَانَتۡ إِلَّا صَيۡحَةࣰ وَٰحِدَةࣰ فَإِذَا هُمۡ جَمِيعࣱ لَّدَيۡنَا مُحۡضَرُونَ","فَٱلۡيَوۡمَ لَا تُظۡلَمُ نَفۡسࣱ شَيۡـࣰٔ ا وَلَا تُجۡزَوۡنَ إِلَّا مَا كُنتُمۡ تَعۡمَلُونَ","إِنَّ أَصۡحَٰبَ ٱلۡجَنَّةِ ٱلۡيَوۡمَ فِي شُغُلࣲ فَٰكِهُونَ","هُمۡ وَأَزۡوَٰجُهُمۡ فِي ظِلَٰلٍ عَلَى ٱلۡأَرَآئِكِ مُتَّكِـُٔونَ","لَهُمۡ فِيهَا فَٰكِهَةࣱ وَلَهُم مَّا يَدَّعُونَ","سَلَٰمࣱ قَوۡلࣰ ا مِّن رَّبࣲّ رَّحِيمࣲ‏","وَٱمۡتَٰزُواْ ٱلۡيَوۡمَ أَيُّهَا ٱلۡمُجۡرِمُونَ","۞أَلَمۡ أَعۡهَدۡ إِلَيۡكُمۡ يَٰبَنِيٓ ءَادَمَ أَن لَّا تَعۡبُدُواْ ٱلشَّيۡطَٰنَۖ إِنَّهُۥ لَكُمۡ عَدُوࣱّ مُّبِينࣱ‏","وَأَنِ ٱعۡبُدُونِيۚ هَٰذَا صِرَٰطࣱ مُّسۡتَقِيمࣱ‏","وَلَقَدۡ أَضَلَّ مِنكُمۡ جِبِلࣰّ ا كَثِيرًاۖ أَفَلَمۡ تَكُونُواْ تَعۡقِلُونَ","هَٰذِهِۦ جَهَنَّمُ ٱلَّتِي كُنتُمۡ تُوعَدُونَ","ٱصۡلَوۡهَا ٱلۡيَوۡمَ بِمَا كُنتُمۡ تَكۡفُرُونَ","ٱلۡيَوۡمَ نَخۡتِمُ عَلَىٰٓ أَفۡوَٰهِهِمۡ وَتُكَلِّمُنَآ أَيۡدِيهِمۡ وَتَشۡهَدُ أَرۡجُلُهُم بِمَا كَانُواْ يَكۡسِبُونَ","وَلَوۡ نَشَآءُ لَطَمَسۡنَا عَلَىٰٓ أَعۡيُنِهِمۡ فَٱسۡتَبَقُواْ ٱلصِّرَٰطَ فَأَنَّىٰ يُبۡصِرُونَ","وَلَوۡ نَشَآءُ لَمَسَخۡنَٰهُمۡ عَلَىٰ مَكَانَتِهِمۡ فَمَا ٱسۡتَطَٰعُواْ مُضِيࣰّ ا وَلَا يَرۡجِعُونَ","وَمَن نُّعَمِّرۡهُ نُنَكِّسۡهُ فِي ٱلۡخَلۡقِۚ أَفَلَا يَعۡقِلُونَ","وَمَا عَلَّمۡنَٰهُ ٱلشِّعۡرَ وَمَا يَنۢبَغِي لَهُۥٓۚ إِنۡ هُوَ إِلَّا ذِكۡرࣱ وَقُرۡءَانࣱ مُّبِينࣱ‏","لِّيُنذِرَ مَن كَانَ حَيࣰّ ا وَيَحِقَّ ٱلۡقَوۡلُ عَلَى ٱلۡكَٰفِرِينَ","أَوَلَمۡ يَرَوۡاْ أَنَّا خَلَقۡنَا لَهُم مِّمَّا عَمِلَتۡ أَيۡدِينَآ أَنۡعَٰمࣰ ا فَهُمۡ لَهَا مَٰلِكُونَ","وَذَلَّلۡنَٰهَا لَهُمۡ فَمِنۡهَا رَكُوبُهُمۡ وَمِنۡهَا يَأۡكُلُونَ","وَلَهُمۡ فِيهَا مَنَٰفِعُ وَمَشَارِبُۚ أَفَلَا يَشۡكُرُونَ","وَٱتَّخَذُواْ مِن دُونِ ٱللَّهِ ءَالِهَةࣰ لَّعَلَّهُمۡ يُنصَرُونَ","لَا يَسۡتَطِيعُونَ نَصۡرَهُمۡ وَهُمۡ لَهُمۡ جُندࣱ مُّحۡضَرُونَ","فَلَا يَحۡزُنكَ قَوۡلُهُمۡۘ إِنَّا نَعۡلَمُ مَا يُسِرُّونَ وَمَا يُعۡلِنُونَ","أَوَلَمۡ يَرَ ٱلۡإِنسَٰنُ أَنَّا خَلَقۡنَٰهُ مِن نُّطۡفَةࣲ فَإِذَا هُوَ خَصِيمࣱ مُّبِينࣱ‏","وَضَرَبَ لَنَا مَثَلࣰ ا وَنَسِيَ خَلۡقَهُۥۖ قَالَ مَن يُحۡيِ ٱلۡعِظَٰمَ وَهِيَ رَمِيمࣱ‏","قُلۡ يُحۡيِيهَا ٱلَّذِيٓ أَنشَأَهَآ أَوَّلَ مَرَّةࣲۖ وَهُوَ بِكُلِّ خَلۡقٍ عَلِيمٌ","ٱلَّذِي جَعَلَ لَكُم مِّنَ ٱلشَّجَرِ ٱلۡأَخۡضَرِ نَارࣰ ا فَإِذَآ أَنتُم مِّنۡهُ تُوقِدُونَ","أَوَلَيۡسَ ٱلَّذِي خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضَ بِقَٰدِرٍ عَلَىٰٓ أَن يَخۡلُقَ مِثۡلَهُمۚ بَلَىٰ وَهُوَ ٱلۡخَلَّٰقُ ٱلۡعَلِيمُ","إِنَّمَآ أَمۡرُهُۥٓ إِذَآ أَرَادَ شَيۡـًٔا أَن يَقُولَ لَهُۥ كُن فَيَكُونُ","فَسُبۡحَٰنَ ٱلَّذِي بِيَدِهِۦ مَلَكُوتُ كُلِّ شَيۡءࣲ وَإِلَيۡهِ تُرۡجَعُونَ"],"ms":["Yaa, Siin","Demi Al-Quran yang mengandungi hikmat-hikmat dan kebenaran yang tetap kukuh","Sesungguhnya engkau (wahai Muhammad adalah seorang Rasul) dari Rasul-rasul yang telah diutus","Yang tetap di atas jalan yang lurus (ugama Islam)","Al-Quran itu, diturunkan oleh Allah Yang Maha Kuasa, lagi Maha Mengasihani","Supaya engkau memberi peringatan dan amaran kepada kaum yang datuk neneknya telah lama tidak diberikan peringatan dan amaran; sebab itulah mereka lalai","Demi sesungguhnya, telah tetap hukuman seksa atas kebanyakan mereka, kerana mereka tidak mahu beriman","Sesungguhnya Kami jadikan (kesombongan dan keengganan mereka tunduk kepada kebenaran sebagai) belenggu yang memberkas kedua tangan mereka ke batang leher mereka; (lebarnya belenggu itu) sampai (menongkatkan) dagu mereka lalu menjadilah mereka terdongak","Dan Kami jadikan (sifat tamak dan gila mereka kepada harta benda dan pangkat itu sebagai) sekatan (yang menghalang mereka daripada memandang kepada keburukan dan kesingkatan masa dunia yang ada) di hadapan mereka, dan sekatan (yang menghalang mereka daripada memikirkan azab yang ada) di belakang mereka (pada hari kiamat). lalu Kami tutup pandangan mereka; maka dengan itu, mereka tidak dapat melihat (jalan yang benar)","Dan (dengan sebab itu) sama sahaja kepada mereka, engkau beri amaran atau engkau tidak beri amaran kepadanya - mereka tidak akan beriman","Sesungguhnya peringatan dan amaran (yang berkesan dan mendatangkan faedah) hanyalah yang engkau berikan kepada orang yang sedia menurut ajaran Al-Quran serta ia takut (melanggar perintah Allah) Ar-Rahman semasa ia tidak dilihat orang dan semasa ia tidak melihat azab Tuhan. Oleh itu berilah kepadanya berita yang mengembirakan dengan keampunan dan pahala yang mulia","Sesungguhnya Kami menghidupkan orang-orang yang mati, dan Kami tuliskan segala yang mereka telah kerjakan serta segala kesan perkataan dan perbuatan yang mereka tinggalkan. Dan (ingatlah) tiap-tiap sesuatu kami catitkan satu persatu dalam Kitab (ibu Suratan) yang jelas nyata","Dan ceritakanlah kepada mereka satu keadaan yang ajaib mengenai kisah penduduk sebuah bandar (yang tertentu) iaitu ketika mereka didatangi Rasul-rasul (Kami)","Ketika Kami mengutus kepada mereka dua orang Rasul lalu mereka mendustakannya; kemudian Kami kuatkan (kedua Rasul itu) dengan Rasul yang ketiga, lalu Rasul-rasul itu berkata: ` Sesungguhnya kami ini adalah diutuskan kepada kamu","Penduduk bandar itu menjawab: \"Kamu ini tidak lain hanyalah manusia seperti kami juga, dan Tuhan Yang Maha Pemurah tidak menurunkan sesuatupun (tentang ugama yang kamu dakwakan); Kamu ini tidak lain hanyalah berdusta","Rasul-rasul berkata: Tuhan Kami mengetahui bahawa sesungguhnya Kami adalah Rasul-rasul yang diutus kepada kamu","Dan tugas Kami hanyalah menyampaikan perintah-perintahNya dengan cara yang jelas nyata","Penduduk bandar itu berkata pula: \"Sesungguhnya kami merasa nahas dan malang dengan sebab kamu. Demi sesungguhnya, kalau kamu tidak berhenti (dari menjalankan tugas yang kamu katakan itu), tentulah kami akan merejam kamu dan sudah tentu kamu akan merasai dari pihak kami azab seksa yang tidak terperi sakitnya","Rasul-rasul itu menjawab: \"Nahas dan malang kamu itu adalah disebabkan (kekufuran) yang ada pada kamu. Patutkah kerana kamu diberi peringatan dan nasihat pengajaran (maka kamu mengancam kami dengan apa yang kamu katakan itu)? (Kamu bukanlah orang-orang yang mahu insaf) bahkan kamu adalah kaum pelampau","Dan (semasa Rasul-rasul itu diancam), datanglah seorang lelaki dari hujung bandar itu dengan berlari, lalu memberi nasihat dengan katanya:\" Wahai kaumku! Turutlah Rasul-rasul itu","Turutlah orang-orang yang tidak meminta kapada kamu sesuatu balasan, sedang mereka adalah orang-orang mandapat hidayah petunjuk","Dan (apabila ditanya: Sudahkah engkau menerima ugama mereka? Maka jawabnya): \"Mengapa aku tidak menyembah Tuhan yang menciptakan daku, dan yang kepadaNyalah (aku dan) kamu semua akan dikembalikan","Patutkah aku menyembah beberapa tuhan yang lain dari Allah? (Sudah tentu tidak patut, kerana) jika Allah yang Maha Pemurah hendak menimpakan daku dengan sesuatu bahaya, mereka tidak dapat memberikan sebarang syafaat kepadaku, dan mereka juga tidak dapat menyelamatkan daku","Sesungguhnya aku (kalau melakukan syirik) tentulah aku pada ketika itu berada dalam kesesatan yang nyata","Sesungguhnya aku telah beriman kepada Tuhan kamu, maka dengarlah (nasihatku)","(Setelah ia mati) lalu dikatakan kepadanya: \"Masuklah ke dalam Syurga\". Ia berkata; \"Alangkah baiknya kalau kaumku mengetahui","Tentang perkara yang menyebabkan daku diampunkan oleh Tuhanku, serta dijadikannya daku dari orang-orang yang dimuliakan","Dan Kami tidak menurunkan kepada kaumnya sesudah ia (mati) sebarang pasukan tentera dari langit (untuk membinasakan mereka), dan tidak perlu Kami menurunkannya","(Kebinasaan mereka) hanyalah dilakukan dengan satu pekikan (yang dahsyat), maka dengan serta merta mereka semua sunyi-sepi tidak hidup lagi","Sungguh besar perasaan sesal dan kecewa yang menimpa hamba-hamba (yang mengingkari kebenaran)! Tidak datang kepada mereka seorang Rasul melainkan mereka mengejek-ejek dan memperolok-olokkannya","Tidakkah mereka mengetahui berapa banyak umat-umat yang telah Kami binasakan sebelum mereka? Umat-umat yang telah binasa itu tidak kembali lagi kepada mereka (bahkan kembali kepada Kami, untuk menerima balasan)","Dan tidak ada satu makhluk pun melainkan dihimpunkan ke tempat perbicaraan Kami, semuanya dibawa hadir (untuk menerima balasan)","Dan dalil yang terang untuk mereka (memahami kekuasaan dan kemurahan kami), ialah bumi yang mati; kami hidupkan dia serta kami keluarkan daripadanya biji-bijian, maka daripada biji-bijian itu mereka makan","Dan kami jadikan di bumi itu kebun-kebun kurma dan anggur, dan kami pancarkan padanya beberapa matair","Supaya mereka makan dari buah-buahannya dan dari apa yang dikerjakan oleh tangan mereka; maka patutkah mereka tidak bersyukur","Maha Suci Tuhan yang telah menciptakan makhluk-makhluk semuanya berpasangan; sama ada dari yang ditumbuhkan oleh bumi, atau dari diri mereka, ataupun dari apa yang mereka tidak mengetahuinya","Dan lagi dalil yang terang untuk mereka (berfikir) ialah malam; Kami hilangkan siang daripadanya, maka dengan serta-merta mereka berada dalam gelap-gelita","Dan (sebahagian dari dalil yang tersebut ialah) matahari; ia kelihatan beredar ke tempat yang ditetapkan baginya; itu adalah takdir Tuhan yang Maha Kuasa, lagi Maha Mengetahui","Dan bulan pula Kami takdirkan dia beredar melalui beberapa peringkat, sehingga di akhir peredarannya kelihatan kembalinya pula ke peringkat awalnya - (berbentuk melengkung) seperti tandan yang kering","(Dengan ketentuan yang demikian), matahari tidak mudah baginya mengejar bulan, dan malam pula tidak dapat mendahului siang; kerana tiap-tiap satunya beredar terapung-apung di tempat edarannya masing-masing","Dan satu dalil lagi untuk mereka (insaf) ialah, Kami membawa belayar jenis keluarga mereka dalam bahtera yang penuh sarat","Dan Kami ciptakan untuk mereka, jenis-jenis kenderaan yang sama dengannya, yang mereka dapat mengenderainya","Dan jika kami kehendaki, kami boleh tenggelamkan mereka; (kiranya Kami lakukan yang demikian) maka tidak ada yang dapat memberi pertolongan kepada mereka, dan mereka juga tidak dapat diselamatkan","Kecuali dengan kemurahan dari pihak Kami memberi rahmat dan kesenangan hidup kepada mereka hingga ke suatu masa","Dan apabila dikatakan kepada mereka: \" berjaga-jagalah kamu akan apa yang ada di hadapan kamu (dari urusan-urusan hidup di dunia ini), dan apa yang ada di belakang kamu (dari huru-hara dan balasan akhirat), supaya kamu beroleh rahmat\", (mereka tidak mengindahkannya)","Dan (itulah tabiat mereka) tidak ada sesuatu keterangan yang sampai kepada mereka dari keterangan-keterangan tuhan mereka melainkan mereka selalu berpaling daripadanya (enggan menerimanya)","Dan apabila dikatakan kepada mereka:\" Dermakanlah sebahagian dari rezeki yang dikurniakan Allah kepada kamu\", berkatalah orang-orang yang kafir itu kepada orang-orang yang beriman (secara mengejek-ejek): \" Patutkah kami memberi makan kepada orang yang jika Allah kehendaki tentulah Ia akan memberinya makan? Kamu ini hanyalah berada dalam kesesatan yang nyata","Dan (apabila mereka diingatkan tentang huru-hara dan balasan akhirat) mereka bertanya (secara mempersenda): \" Bilakah datangnya (hari akhirat) yang dijanjikan itu? Jika betul kamu orang-orang yang benar (maka kami sedia menunggu)","Mereka tidak menunggu melainkan satu pekikan yang - (dengan secara mengejut) akan membinasakan mereka semasa mereka dalam keadaan leka bertengkar (merundingkan urusan dunia masing-masing)","Maka dengan itu, mereka tidak berpeluang membuat sebarang pesanan (wasiat atau lainnya), dan (kalau mereka berada di luar) mereka tidak sempat kembali kepada keluarganya","Dan sudah tentu akan ditiupkan sangkakala (menghidupkan orang-orang yang telah mati; apabila berlaku yang demikian) maka semuanya segera bangkit keluar dari kubur masing-masing (untuk) mengadap Tuhannya","(Pada ketika itu) orang-orang yang tidak percayakan hidup semula berkata: Aduhai celakanya kami! Siapakah yang membangkitkan kami dari kubur tempat tidur kami?,, (Lalu dikatakan kepada mereka): \" Inilah dia yang telah dijanjikan oleh Allah Yang Maha Pemurah dan benarlah berita yang disampaikan oleh Rasul-rasul","Hanyalah dengan berlakunya satu pekikan sahaja, maka dengan serta merta mereka dihimpunkan ke tempat perbicaraan Kami, semuanya dibawa hadir (untuk menerima balasan)","Maka pada hari itu, tidak ada seseorang yang akan dianiaya sedikitpun, dan kamu pula tidak akan dibalas melainkan menurut amal yang kamu telah kerjakan","Sesungguhnya penduduk Syurga pada hari itu, berada dalam keadaan sibuk leka menikmati kesenangan","Mereka dengan pasangan-pasangan mereka bersukaria di tempat yang teduh, sambil duduk berbaring di atas pelamin","Mereka beroleh dalam Syurga itu pelbagai jenis buah-buahan, dan mereka beroleh apa sahaja yang mereka kehendaki","(Mereka juga beroleh) ucapan salam sejahtera dari Tuhan Yang Maha Mengasihani","Dan (sebaliknya dikatakan kepada orang-orang yang kafir): \"Berpisahlah kamu pada hari ini, hai orang-orang yang berdosa, (dari bercampur gaul dengan orang-orang yang beriman)","Bukankah Aku telah perintahkan kamu wahai anak-anak Adam, supaya kamu jangan menyembah Syaitan? Sesungguhnya ia musuh yang nyata terhadap kamu","Dan (Aku perintahkan): hendaklah kamu menyembahKu; inilah jalan yang lurus","Dan sesungguhnya Syaitan itu telah menyesatkan golongan yang ramai di antara kamu; (setelah kamu mengetahui akibat mereka) maka tidakkah sepatutnya kamu berfikir dan insaf","Yang kamu saksikan sekarang ialah neraka Jahannam, yang kamu selalu diancam memasukinya (kalau kamu tidak taatkan perintah Allah)","Rasalah kamu bakarannya pada hari ini, disebabkan perbuatan kufur yang kamu telah lakukan","Pada waktu itu Kami meteraikan mulut mereka (sejurus); dan (memberi peluang kepada) tangan-tangan mereka memberitahu Kami (kesalahan masing-masing), dan kaki mereka pula menjadi saksi tentang apa yang mereka telah usahakan","(Matahati orang-orang yang menderhaka itu rosak) dan kalau Kami kehendaki, Kami berkuasa menghapuskan bentuk dan biji mata kepala mereka menjadi rata, sehingga masing-masing menerpa mencari-cari jalan (yang biasa mereka lalui). (Kiranya dijadikan demikian) maka bagaimanakah mereka dapat melihatnya","(Kekuatan akal fikiran mereka juga tidak sihat) dan kalau kami kehendaki, kami berkuasa mangubahkan keadaan jasmani mereka (menjadi kaku beku) di tempat yang mereka berada padanya; maka dengan itu, mereka tidak dapat mara ke hadapan dan juga tidak dapat undur ke belakang","Dan (hendaklah diingat bahawa) sesiapa yang Kami panjangkan umurnya, Kami balikkan kembali kejadiannya (kepada keadaan serba lemah; hakikat ini memang jelas) maka mengapa mereka tidak mahu memikirkannya","(Nabi Muhammad bukanlah penyair) dan Kami tidak mengajarkan syair kepadanya, dan kepandaian bersyair itu pula tidak sesuai baginya. Yang Kami wahyukan kepadanya itu tidak lain melainkan nasihat pengajaran dan Kitab Suci yang memberi penerangan","Supaya ia memberi peringatan kepada orang yang sedia hidup (hatinya), dan supaya nyata tetapnya hukuman (azab) terhadap orang-orang yang kufur ingkar","Tidakkah mereka melihat dan memikirkan, bahawa Kami telah menciptakan untuk mereka binatang-binatang ternak, di antara jenis-jenis makhluk yang telah Kami ciptakan dengan kekuasaan Kami lalu mereka memilikinya","Dan Kami jinakkan dia untuk kegunaan mereka; maka sebahagian di antaranya menjadi kenderaan mereka, dan sebahagian lagi mereka makan","Dan mereka beroleh berbagai faedah dan kegunaan pada binatang ternak itu dan juga beroleh minuman; maka mengapa mereka tidak mahu bersyukur","Dan tergamak mereka menyembah beberapa tuhan yang lain dari Allah, (dengan harapan semoga mereka mendapat pertolongan (dari makhluk-makhluk itu)","Benda-benda yang mereka sembah itu tidak dapat sama sekali menolong mereka, sedang benda-benda itu sendiri menjadi tentera yang akan dibawa hadir (pada hari kiamat, untuk memberi azab seksa) kepada mereka","Maka janganlah engkau (wahai Muhammad) berdukacita disebabkan tuduhan-tuduhan mereka (terhadapmu). Sesungguhnya Kami sedia mengetahui apa yang mereka sembunyikan dan apa yang mereka nyatakan","Tidakkah manusia itu melihat dan mengetahui, bahawa Kami telah menciptakan dia dari (setitis) air benih? Dalam pada itu (setelah Kami sempurnakan kejadiannya dan tenaga kekuatannya) maka dengan tidak semena-mena menjadilah ia seorang pembantah yang terang jelas bantahannya (mengenai kekuasaan Kami menghidupkan semula orang-orang yang mati)","Serta ia mengemukakan satu misal perbandingan kepada Kami (tentang kekuasaan itu), dan ia pula lupakan keadaan Kami menciptakannya sambil ia bertanya: \"Siapakah yang dapat menghidupkan tulang-tulang yang telah hancur seperti debu","Katakanlah: \"Tulang-tulang yang hancur itu akan dihidupkan oleh Tuhan yang telah menciptakannya pada awal mula wujudnya; dan Ia Maha Mengetahui akan segala keadaan makhluk-makhluk (yang diciptakanNya)","Tuhan yang telah menjadikan api (boleh didapati) dari pohon-pohon yang hijau basah untuk kegunaan kamu, maka kamu pun selalu menyalakan api dari pohon-pohon itu","Tidakkah diakui dan tidakkah dipercayai bahawa Tuhan yang telah menciptakan langit dan bumi (yang demikian besarnya) - berkuasa menciptakan semula manusia sebagaimana Ia menciptakan mereka dahulu? Ya! Diakui dan dipercayai berkuasa! Dan Dia lah Pencipta yang tidak ada bandinganNya, lagi Yang Maha Mengetahui","Sesungguhnya keadaan kekuasaanNya apabila Ia menghendaki adanya sesuatu, hanyalah Ia berfirman kepada (hakikat) benda itu: \" Jadilah engkau! \". Maka ia terus menjadi","Oleh itu akuilah kesucian Allah (dengan mengucap: Subhaanallah!) - Tuhan yang memiliki dan menguasai tiap-tiap sesuatu, dan kepadaNyalah kamu semua dikembalikan"],"id":["Yā Sīn","Demi Alquran yang penuh hikmah","sungguh, engkau (Muhammad) adalah salah seorang dari rasul-rasul","(yang berada) di atas jalan yang lurus","(sebagai wahyu) yang diturunkan oleh (Allah) Yang Mahaperkasa, Maha Penyayang","agar engkau memberi peringatan kepada suatu kaum yang nenek moyangnya belum pernah diberi peringatan, karena itu mereka lalai","Sungguh, pasti berlaku perkataan (hukuman) terhadap kebanyakan mereka, karena mereka tidak beriman","Sungguh, Kami telah memasang belenggu di leher mereka, lalu tangan mereka (diangkat) ke dagu, karena itu mereka tertengadah","Dan Kami jadikan di hadapan mereka sekat (dinding) dan di belakang mereka juga sekat, dan Kami tutup (mata) mereka sehingga mereka tidak dapat melihat","Dan sama saja bagi mereka, apakah engkau memberi peringatan kepada mereka atau engkau tidak memberi peringatan kepada mereka, mereka tidak akan beriman juga","(Sesungguhnya engkau hanya memberi peringatan kepada orang-orang yang mau mengikuti peringatan717) dan yang takut kepada Tuhan Yang Maha Pengasih, walaupun mereka tidak melihat-Nya. Maka berilah mereka kabar gembira dengan ampunan dan pahala yang mulia","Sungguh, Kamilah yang menghidupkan orang-orang yang mati, dan Kamilah yang mencatat apa yang telah mereka kerjakan dan bekas-bekas yang mereka (tinggalkan). Dan segala sesuatu Kami kumpulkan dalam Kitab yang jelas (Lauḥ Maḥfūẓ)","Dan buatlah suatu perumpamaan bagi mereka, yaitu penduduk suatu negeri, ketika utusan-utusan datang kepada mereka","(yaitu) ketika Kami mengutus kepada mereka dua orang utusan, lalu mereka mendustakan keduanya; kemudian Kami kuatkan dengan (utusan) yang ketiga, maka ketiga (utusan itu) berkata, \"Sungguh, kami adalah orang-orang yang diutus kepadamu","Mereka (penduduk negeri) menjawab, \"Kamu ini hanyalah manusia seperti kami, dan (Allah) Yang Maha Pengasih tidak menurunkan sesuatu apa pun; kamu hanyalah pendusta belaka","Mereka berkata, \"Tuhan kami mengetahui sesungguhnya kami adalah utusan-utusan (-Nya) kepada kamu","Dan kewajiban kami hanyalah meyampaikan (perintah Allah) dengan jelas","Mereka menjawab, \"Sesungguhnya kami bernasib malang karena kamu. Sungguh, jika kamu tidak berhenti (menyeru kami), niscaya kami rajam kamu dan kamu pasti akan merasakan siksaan yang pedih dari kami","Mereka (utusan-utusan) itu berkata, \"Kemalangan kamu itu adalah karena kamu sendiri. Apakah kamu diberi peringatan? Sebenarnya kamu adalah kaum yang melampaui batas","(Dan datanglah dari ujung kota, seorang laki-laki718) dengan bergegas dia berkata, \"Wahai kaumku! Ikutilah utusan-utusan itu","Ikutilah orang yang tidak meminta imbalan kepadamu; dan mereka adalah orang-orang yang mendapat petunjuk","Dan tidak ada alasan bagiku untuk tidak menyembah (Allah) yang telah menciptakanku dan hanya kepada-Nyalah kamu akan dikembalikan","Mengapa aku akan menyembah tuhan-tuhan selain-Nya? Jika (Allah) Yang Maha Pengasih menghendaki bencana terhadapku, pasti pertolongan mereka tidak berguna sama sekali bagi diriku dan mereka (juga) tidak dapat menyelamatkanku","Sesungguhnya jika aku (berbuat) begitu, pasti aku berada dalam kesesatan yang nyata","Sesungguhnya aku telah beriman kepada Tuhanmu; maka dengarkanlah (pengakuan keimanan)ku","Dikatakan (kepadanya), \"Masuklah ke surga.\"719) Dia (laki-laki itu) berkata, \"Alangkah baiknya sekiranya kaumku mengetahui","apa yang menyebabkan Tuhanku memberi ampun kepadaku dan menjadikan aku termasuk orang-orang yang telah dimuliakan","Dan setelah dia (meninggal), Kami tidak menurunkan suatu pasukan pun dari langit kepada kaumnya, dan Kami tidak perlu menurunkannya","Tidak ada siksaan terhadap mereka melainkan dengan satu teriakan saja; maka seketika itu mereka mati","Alangkah besar penyesalan terhadap hamba-hamba itu, setiap datang seorang rasul kepada mereka, mereka selalu memperolok-olokkannya","Tidakkah mereka mengetahui berapa banyak umat-umat sebelum mereka yang telah Kami binasakan. Orang-orang (yang telah Kami binasakan) itu tidak ada yang kembali kepada mereka","Dan setiap (umat), semuanya akan dihadapkan kepada Kami","Dan suatu tanda (kebesaran Allah) bagi mereka adalah bumi yang mati (tandus). Kami hidupkan bumi itu dan Kami keluarkan darinya biji-bijian, maka dari (biji-bijian) itu mereka makan","Dan Kami jadikan padanya di bumi itu kebun-kebun kurma dan anggur dan Kami pancarkan padanya beberapa mata air","agar mereka dapat makan dari buahnya, dan dari hasil usaha tangan mereka. Maka mengapa mereka tidak bersyukur","Mahasuci (Allah) yang telah menciptakan semuanya berpasang-pasangan, baik dari apa yang ditumbuhkan oleh bumi dan dari diri mereka sendiri, maupun dari apa yang tidak mereka ketahui","Dan suatu tanda (kebesaran Allah) bagi mereka adalah malam; Kami tanggalkan siang dari (malam) itu, maka seketika itu mereka (berada dalam) kegelapan","dan matahari berjalan di tempat peredarannya. Demikianlah ketetapan (Allah) Yang Mahaperkasa, Maha Mengetahui","Dan telah Kami tetapkan tempat peredaran bagi bulan, sehingga (setelah ia sampai ke tempat peredaran yang terakhir) kembalilah ia seperti bentuk tandan yang tua","Tidaklah mungkin bagi matahari mengejar bulan dan malam pun tidak dapat mendahului siang. Masing-masing beredar pada garis edarnya","Dan suatu tanda (kebesaran Allah) bagi mereka adalah bahwa Kami angkut keturunan mereka dalam kapal yang penuh muatan","dan Kami ciptakan (juga) untuk mereka (angkutan lain) seperti apa yang mereka kendarai","Dan jika Kami menghendaki, Kami tenggelamkan mereka. Maka tidak ada penolong bagi mereka dan tidak (pula) mereka diselamatkan","melainkan (Kami selamatkan mereka) karena rahmat yang besar dari Kami dan untuk memberikan kesenangan hidup sampai waktu tertentu","Dan apabila dikatakan kepada mereka, \"Takutlah kamu akan siksa yang dihadapanmu (di dunia) dan azab yang akan datang (akhirat) agar kamu mendapat rahmat","Dan setiap kali suatu tanda dari tanda-tanda (kebesaran) Tuhan datang kepada mereka, mereka selalu berpaling darinya","Dan apabila dikatakan kepada mereka, \"Infakkanlah sebagian rezeki yang diberikan Allah kepadamu,\" orang-orang yang kafir itu berkata kepada orang-orang yang beriman, \"Apakah pantas kami memberi makan kepada orang-orang yang jika Allah menghendaki Dia akan memberinya makan? Kamu benar-benar dalam kesesatan yang nyata","Dan mereka (orang-orang kafir) berkata, \"Kapan janji (hari berbangkit) itu (terjadi) jika kamu orang-orang yang benar","(Mereka hanya menunggu satu teriakan,723) yang akan membinasakan mereka ketika mereka sedang bertengkar","Sehingga mereka tidak mampu membuat suatu wasiat dan mereka (juga) tidak dapat kembali kepada keluarganya","(Lalu ditiuplah sangkakala,724) maka seketika itu mereka keluar dari kuburnya (dalam keadaan hidup), menuju kepada Tuhannya","Mereka berkata, \"Celakalah kami! Siapakah yang membangkitkan kami dari tempat tidur kami (kubur)?\" Inilah yang dijanjikan (Allah) Yang Maha Pengasih dan benarlah rasul-rasul(-Nya)","Teriakan itu hanya sekali saja, maka seketika itu mereka semua dihadapkan kepada Kami (untuk dihisab)","Maka pada hari itu seseorang tidak akan dirugikan sedikit pun dan kamu tidak akan diberi balasan, kecuali sesuai dengan apa yang telah kamu kerjakan","Sesungguhnya penghuni surga pada hari itu bersenang-senang dalam kesibukan (mereka)","Mereka dan pasangan-pasangannya berada dalam tempat yang teduh, bersandar di atas dipan-dipan","Di surga itu mereka memperoleh buah-buahan dan memperoleh apa saja yang mereka inginkan","(Kepada mereka dikatakan), \"Salām,\" sebagai ucapan selamat dari Tuhan Yang Maha Penyayang","Dan (dikatakan kepada orang-orang kafir), \"Berpisahlah kamu (dari orang-orang mukmin) pada hari ini, wahai orang-orang yang berdosa","Bukankah Aku telah memerintahkan kepadamu wahai anak cucu Adam agar kamu tidak menyembah setan? Sungguh, setan itu musuh yang nyata bagi kamu","dan hendaklah kamu menyembah-Ku. Inilah jalan yang lurus","Dan sungguh, ia (setan itu) telah menyesatkan sebagian besar di antara kamu. Maka apakah kamu tidak mengerti","Inilah (neraka) Jahanam yang dahulu telah diperingatkan kepadamu","Masuklah ke dalamnya pada hari ini karena dahulu kamu mengingkarinya","Pada hari ini Kami tutup mulut mereka; tangan mereka akan berkata kepada Kami dan kaki mereka akan memberi kesaksian terhadap apa yang dahulu mereka kerjakan","Dan jika Kami menghendaki, pastilah Kami hapuskan penglihatan mata mereka; sehingga mereka berlomba-lomba (mencari) jalan. Maka bagaimana mungkin mereka dapat melihat","Dan jika Kami menghendaki, pastilah Kami ubah bentuk mereka di tempat mereka berada; sehingga mereka tidak sanggup berjalan lagi dan juga tidak sanggup kembali","Dan barang siapa Kami panjangkan umurnya niscaya Kami kembalikan dia kepada awal kejadian(nya).725) Maka mengapa mereka tidak mengerti","Dan Kami tidak mengajarkan syair kepadanya (Muhammad) dan bersyair itu tidaklah pantas baginya. Alquran itu tidak lain hanyalah pelajaran dan Kitab yang jelas","agar dia (Muhammad) memberi peringatan kepada orang-orang yang hidup (hatinya) dan agar pasti ketetapan (azab) terhadap orang-orang kafir","Dan tidakkah mereka melihat bahwa Kami telah meciptakan hewan ternak untuk mereka, yaitu sebagian dari apa yang telah Kami ciptakan dengan kekuasaan Kami, lalu mereka menguasainya","Dan Kami menundukkannya (hewan-hewan itu) untuk mereka; lalu sebagiannya untuk menjadi tunggangan mereka dan sebagian untuk mereka makan","Dan mereka memperoleh berbagai manfaat dan minuman darinya. Maka mengapa mereka tidak bersyukur","Dan mereka mengangkat sesembahan selain Allah agar mereka mendapat pertolongan","Mereka (sesembahan) itu tidak dapat menolong mereka; padahal mereka itu menjadi tentara yang disiapkan untuk menjaga (sesembahan) itu","Maka jangan sampai ucapan mereka membuat engkau (Muhammad) bersedih hati. Sungguhnya, Kami mengetahui apa yang mereka rahasiakan dan apa yang mereka tampakkan","Dan tidakkah manusia memperhatikan bahwa Kami menciptakannya dari setetes mani, ternyata dia menjadi musuh yang nyata","Dan dia membuat perumpamaan bagi Kami dan melupakan asal kejadiannya; dia berkata, \"Siapakah yang dapat menghidupkan tulang-belulang, yang telah hancur luluh","Katakanlah (Muhammad), \"Yang akan menghidupkannya ialah (Allah) yang menciptakannya pertama kali. Dan Dia Maha Mengetahui tentang segala makhluk","yaitu (Allah) yang menjadikan api untukmu dari kayu yang hijau, maka seketika itu kamu nyalakan (api) dari kayu itu","Dan bukankah (Allah) yang menciptakan langit dan bumi, mampu menciptakan kembali yang serupa itu (jasad mereka yang sudah hancur)? Benar, dan Dia Maha Pencipta, Maha Mengetahui","Sesungguhnya urusan-Nya apabila Dia menghendaki sesuatu Dia hanya berkata kepadanya, \"Jadilah!\" Maka jadilah sesuatu itu","Maka Mahasuci (Allah) yang ditangan-Nya kekuasaan atas segala sesuatu dan kepada-Nya kamu dikembalikan"]},"mathurat":[{"n":"","x":1,"t":3,"a":"اَعُوذُ بِٱللهِ السَّمِيْعِ الْعَلِيْمِ مِنَ الشَّيْطَانِ الرَّجِيْمِ","m":"Aku berlindung dengan Allah yang Maha Mendengar lagi Maha Mengetahui daripada gangguan syaitan terkutuk."},{"n":"Al Fatihah (1-7)","x":1,"t":3,"a":"بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ١ ٱلۡحَمۡدُ لِلَّهِ رَبِّ ٱلۡعَٰلَمِينَ٢ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ٣ مَٰلِكِ يَوۡمِ ٱلدِّينِ٤ إِيَّاكَ نَعۡبُدُ وَإِيَّاكَ نَسۡتَعِينُ٥ ٱهۡدِنَا ٱلصِّرَٰطَ ٱلۡمُسۡتَقِيمَ٦ صِرَٰطَ ٱلَّذِينَ أَنۡعَمۡتَ عَلَيۡهِمۡ غَيۡرِ ٱلۡمَغۡضُوبِ عَلَيۡهِمۡ وَلَا ٱلضَّآلِّينَ٧","m":"(1) Dengan nama Allah yang Maha Pemurah lagi Maha Pengasih. (2) Segala puji bagi Allah(SWT), Tuhan Semesta Alam. (3) Maha Pemurah lagi Maha Penyayang. (4) Yang menguasai hari pembalasan(kiamat). (5) Hanya Engkaulah yang kami sembah dan Engkaulah sahaja kami memohon pertolongan. (6) Tunjukkanlah kami jalan yang lurus. (7) (iaitu)jalan orang-orang yang Engkau anugerahkan nikmat kepada mereka; bukan(jalan mereka yang dimurkai) dan bukan pula jalan orang yang sesat."},{"n":"Al Baqarah (1-5)","x":1,"t":3,"a":"الٓمٓ١ ذَٰلِكَ ٱلۡكِتَٰبُ لَا رَيۡبَۛ فِيهِۛ هُدٗى لِّلۡمُتَّقِينَ٢ ٱلَّذِينَ يُؤۡمِنُونَ بِٱلۡغَيۡبِ وَيُقِيمُونَ ٱلصَّلَوٰةَ وَمِمَّا رَزَقۡنَٰهُمۡ يُنفِقُونَ٣ وَٱلَّذِينَ يُؤۡمِنُونَ بِمَآ أُنزِلَ إِلَيۡكَ وَمَآ أُنزِلَ مِن قَبۡلِكَ وَبِٱلۡأٓخِرَةِ هُمۡ يُوقِنُونَ٤ أُوْلَٰٓئِكَ عَلَىٰ هُدٗى مِّن رَّبِّهِمۡۖ وَأُوْلَٰٓئِكَ هُمُ ٱلۡمُفۡلِحُونَ٥","m":"(1) Alif, Laam, Miim. (2) Kitab(Al-Quran) ini tidak ada sebarang keraguan padanya; petunjuk bagi mereka yang bertakwa. (3) Iaitu mereka yang beriman kepada yang ghaib, yang mendirikan solat dan menafkahkan sebahagian rezeki meraka yang Kami anugerahkan kepada mereka. (4) Dan mereka yang beriman kepada kitab(Al-Quran) yang telah diturunkan kepadamu dan yang sebelummu serta mereka yang yakin akan adanya(kehidupan) akhirat. (5) Mereka itulah yang tetap mendapat petunjuk dari Tuhannya dan merekalah orang-orang yang beruntung. "},{"n":"Al Baqarah (255)","x":1,"t":3,"a":"ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلۡحَيُّ ٱلۡقَيُّومُۚ لَا تَأۡخُذُهُۥ سِنَةٞ وَلَا نَوۡمٞۚ لَّهُۥ مَا فِي ٱلسَّمَٰوَٰتِ وَمَا فِي ٱلۡأَرۡضِۗ مَن ذَا ٱلَّذِي يَشۡفَعُ عِندَهُۥٓ إِلَّا بِإِذۡنِهِۦۚ يَعۡلَمُ مَا بَيۡنَ أَيۡدِيهِمۡ وَمَا خَلۡفَهُمۡۖ وَلَا يُحِيطُونَ بِشَيۡءٖ مِّنۡ عِلۡمِهِۦٓ إِلَّا بِمَا شَآءَۚ وَسِعَ كُرۡسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضَۖ وَلَا يَـُٔودُهُۥ حِفۡظُهُمَاۚ وَهُوَ ٱلۡعَلِيُّ ٱلۡعَظِيمُ٢٥٥","m":"(255) Dialah Allah, tiada tuhan yang sebenarnya disembah melainkan Dia yang sentiasa mengurus hamba-Nya sendirian, tidak dipengaruhi oleh mengantuk dan tidur. Dialah yang mempunyai segala di langit dan segala di bumi, siapakah gerangan yang memberikan syafaat di sisi-Nya dengan hak tidak dengan keizinan-Nya? Tuhan mengetahui apa yang dihadapan mereka dan mereka tidak meliputi(mengetahui) sesuatu dari ilmunya melainkan barang yang dikehendaki-Nya. Maha Luas Kursi(kerajaan)-Nya meliputi sekelian langit dan bumi. Dan tiada berat bagi-Nya memelihara keduanya dan dialah Yang Maha Tinggi Maha Agung."},{"n":"Al Baqarah (256)","x":1,"t":3,"a":"لَآ إِكۡرَاهَ فِي ٱلدِّينِۖ قَد تَّبَيَّنَ ٱلرُّشۡدُ مِنَ ٱلۡغَيِّۚ فَمَن يَكۡفُرۡ بِٱلطَّٰغُوتِ وَيُؤۡمِنۢ بِٱللَّهِ فَقَدِ ٱسۡتَمۡسَكَ بِٱلۡعُرۡوَةِ ٱلۡوُثۡقَىٰ لَا ٱنفِصَامَ لَهَاۗ وَٱللَّهُ سَمِيعٌ عَلِيمٌ٢٥٦","m":"(256) Tiada paksaan dalam agama(Islam), kerana telah nyata kebenaran(Islam) daripada kesesatan(kufur). Oleh itu orang yang tidak mempercayai taghut dan beriman kepada Allah, dia berpegang kepada simpulan(ajaran agama) yang teguh serta tidak akan putus. Dan ingatlah, Allah Maha Mendengar, lagi Maha Mengetahui."},{"n":"Al Baqarah (257)","x":1,"t":3,"a":"ٱللَّهُ وَلِيُّ ٱلَّذِينَ ءَامَنُواْ يُخۡرِجُهُم مِّنَ ٱلظُّلُمَٰتِ إِلَى ٱلنُّورِۖ وَٱلَّذِينَ كَفَرُوٓاْ أَوۡلِيَآؤُهُمُ ٱلطَّٰغُوتُ يُخۡرِجُونَهُم مِّنَ ٱلنُّورِ إِلَى ٱلظُّلُمَٰتِۗ أُوْلَٰٓئِكَ أَصۡحَٰبُ ٱلنَّارِۖ هُمۡ فِيهَا خَٰلِدُونَ٢٥٧","m":"(257) Allah Pelindung(Yang mengawal dan menolong) orang beriman. Ia mengeluarkan mereka daripada kegelapan(kufur) kepada cahaya(Iman). Dan orang kafir, penolong-penolong mereka ialah taghut yang mengeluarkan mereka daripada cahaya(Iman) kepada kegelapan(kufur). Mereka itulah ahli neraka. Mereka kekal didalamnya."},{"n":"Al Baqarah (284)","x":1,"t":3,"a":"لِّلَّهِ مَا فِي ٱلسَّمَٰوَٰتِ وَمَا فِي ٱلۡأَرۡضِۗ وَإِن تُبۡدُواْ مَا فِيٓ أَنفُسِكُمۡ أَوۡ تُخۡفُوهُ يُحَاسِبۡكُم بِهِ ٱللَّهُۖ فَيَغۡفِرُ لِمَن يَشَآءُ وَيُعَذِّبُ مَن يَشَآءُۗ وَٱللَّهُ عَلَىٰ كُلِّ شَيۡءٖ قَدِيرٌ٢٨٤","m":"(284) Segala yang ada di langit dan yang ada di bumi adalah kepunyaan Allah. Dan jika kamu melahirkan apa yang ada di dalam hati kamu atau kamu memyembunyikannya, nescaya Allah akan menghitung dan menyatakannya kepada kamu. Kemudian Ia mengampunkan bagi sesiapa yang dikehendakiNya dan menyeksa sesiapa yang dikehendakiNya (menurut undang-undang peraturanNya) Dan (ingatlah), Allah Maha Kuasa atas tiap-tiap sesuatu."},{"n":"Al Baqarah (285)","x":1,"t":3,"a":"ءَامَنَ ٱلرَّسُولُ بِمَآ أُنزِلَ إِلَيۡهِ مِن رَّبِّهِۦ وَٱلۡمُؤۡمِنُونَۚ كُلٌّ ءَامَنَ بِٱللَّهِ وَمَلَـٰٓٮِٕكَتِهِۦ وَكُتُبِهِۦ وَرُسُلِهِۦ لَا نُفَرِّقُ بَيۡنَ أَحَدٖ مِّن رُّسُلِهِۦۚ وَقَالُواْ سَمِعۡنَا وَأَطَعۡنَاۖ غُفۡرَانَكَ رَبَّنَا وَإِلَيۡكَ ٱلۡمَصِيرُ ٢٨٥","m":"(285) Rasul telah beriman kepada Al-Quran yang diturunkan kepadanya dari Tuhannya, demikian pula orang-orang yang beriman. Semuanya beriman kepada Allah, Malaikat-malaikatNya, kitab-kitabNya, dan rasul-rasulNya. (Mereka mengatakan): \"Kami tidak membezakan antara seseorang pun(dengan yang lain) dari Rasul-rasulNya\", dan mereka mengatakan: \"Kami dengar dan kami taat\", (Mereka berdoa): \"Ampunilah kami ya Tuhan kami dan kepada Engkaulah tempat kami kembali"},{"n":"Al Baqarah (286)","x":1,"t":3,"a":"لَا يُكَلِّفُ ٱللَّهُ نَفۡسًا إِلَّا وُسۡعَهَاۚ لَهَا مَا كَسَبَتۡ وَعَلَيۡهَا مَا ٱكۡتَسَبَتۡۗ رَبَّنَا لَا تُؤَاخِذۡنَآ إِن نَّسِينَآ أَوۡ أَخۡطَأۡنَاۚ رَبَّنَا وَلَا تَحۡمِلۡ عَلَيۡنَآ إِِصۡرًا كَمَا حَمَلۡتَهُۥ عَلَى ٱلَّذِينَ مِن قَبۡلِنَاۚ رَبَّنَا وَلَا تُحَمِّلۡنَا مَا لَا طَاقَةَ لَنَا بِهِۦۖ وَٱعۡفُ عَنَّا وَٱغۡفِرۡ لَنَا وَٱرۡحَمۡنَآۚ أَنتَ مَوۡلَىٰنَا فَٱنصُرۡنَا عَلَى ٱلۡقَوۡمِ ٱلۡكَٰفِرِينَ٢٨٦","m":"(286) Allah tidak membebani seseorang melainkan sesuai dengan kesanggupannya. Ia mendapat pahala(dari kebajikan) yang diusahakannya dan ia mendapat siksaan(dari kejahatan) yang dikerjakannya. (Mereka berdoa): \"Ya Tuhan kami, janganlah engkau hukum kami jika kami lupa atau kami bersalah. Ya Tuhan kami janganlah Engkau bebankan kami beban yang berat sebagaimana Engkau bebankan kepada orang-orang yang sebelum kami. Ya Tuhan kami, janganlah Engkau pikulkan kepada kami apa yang tidak sanggup kami memikulnya. Berikanlah maaf kepada kami. Engkaulah penolong kami, maka tolonglah kami terhadap kaum yang kafir\"."},{"n":"Al Ikhlas (1-4)","x":3,"t":3,"a":"بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ\nقُلۡ هُوَ ٱللَّهُ أَحَدٌ١ ٱللَّهُ ٱلصَّمَدُ٢ لَمۡ يَلِدۡ وَلَمۡ يُولَدۡ٣ وَلَمۡ يَكُن لَّهُۥ كُفُوًا أَحَدُۢ٤","m":"(1) Katakanlah (wahai Muhammad): (Tuhanku) ialah Allah Yang Maha Esa. (2) Allah Yang menjadi tumpuan sekalian makhluk untuk memohon sebarang hajat. (3) Dia tiada beranak dan Dia pula tidak diperanakkan. (4) Dan tidak ada sesiapapun yang setara denganNya. "},{"n":"Al Falaq (1-5)","x":3,"t":3,"a":"بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ\nقُلۡ أَعُوذُ بِرَبِّ ٱلۡفَلَقِ١ مِن شَرِّ مَا خَلَقَ٢ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ٣ وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِي ٱلۡعُقَدِ٤ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ٥","m":"(1) Katakanlah (wahai Muhammad): Aku berlindung kepada (Allah) Tuhan yang menciptakan sekalian makhluk. (2) Daripada bencana para makhluk ciptaan-Nya. (3) Dan daripada bahaya gelap apabila ia (merangkak) masuk. (4) Dan daripada bencana kejahatan makhluk-makhluk yang menghembus-hembus pada pelbagai simpulan sihir. (5) Dan daripada kejahatan orang yang dengki apabila dia melakukan dengkinya."},{"n":"An Nas (1-6)","x":3,"t":3,"a":"بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ\nقُلۡ أَعُوذُ بِرَبِّ ٱلنَّاسِ١ مَلِكِ ٱلنَّاسِ٢ إِلَٰهِ ٱلنَّاسِ٣ مِن شَرِّ ٱلۡوَسۡوَاسِ ٱلۡخَنَّاسِ٤ ٱلَّذِي يُوَسۡوِسُ فِي صُدُورِ ٱلنَّاسِ٥ مِنَ ٱلۡجِنَّةِ وَٱلنَّاسِ٦","m":"(1) Katakanlah (wahai Muhammad): Aku berlindung kepada (Allah) Pemelihara sekalian manusia. (2) Yang Menguasai sekalian manusia, (3) Tuhan yang berhak disembah oleh sekalian makhluk, (4) Dari kejahatan pembisik penghasut yang timbul tenggelam, (5) Yang melemparkan bisikan dan hasutan ke dalam hati manusia, (6) (Iaitu pembisik dan penghasut) dari kalangan jin dan manusia."},{"n":"","x":3,"t":1,"a":"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ لاَشَرِيكَ لَهُ\nلاَ إِلَهَ إِلاَّ هُوَ وَإِلَيْهِ النُّشُورُ","m":"(Pagi) \"Kami hayati pagi ini ya Allah di mana pada pagi ini kerajaan alam ini di tanganMu. Puji untuk Allah, tidak ada sekutu bagi-Nya. Tidak ada Tuhan sebenarnya melainkan Dia. KepadaNya kami bakal dihimpunkan."},{"n":"","x":3,"t":2,"a":"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ لاَشَرِيكَ لَهُ\nلاَ إِلَهَ إِلاَّ هُوَ وَإِلَيْهِ الْمَصِيرُ","m":"(Petang) \"Kami hayati petang ini ya Allah di mana pada petang ini kerajaan alam ini di tangan-Mu. Puji untuk Allah, tidak ada sekutu bagi-Nya. Tidak ada Tuhan sebenarnya melainkan Dia. Kepada-Nya kami bakal dihimpunkan."},{"n":"","x":3,"t":1,"a":"أَصْبَحْنَا عَلَى فِطْرَةِ الإِسْلَامِ\nوَكَلِمَةِ الإِخْلَاصِ\nوَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللهُ عَلَيهِ وَسَلَّمَ\nوَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا\nوَمَا كَانَ مِنَ الْمُشْرِكِينَ","m":"(Pagi) \"Kami hayati suasana pagi ini atas landasan fitrah dan perwatakan Islam. Berpegang kepada kalimah Ikhlas (dan prinsip) keikhlasan. Berpegang kepada agama Nabi-Mu Muhammad (SAW), yang juga agama bapa kami (Nabi) Ibrahim dengan setulus hati. Dan (Nabi) Ibrahim sama sekali bukan seorang yang musyrikin."},{"n":"","x":3,"t":2,"a":"أَمْسَيْنَا عَلَى فِطْرَةِ الإِسْلَامِ\nوَكَلِمَةِ الإِخْلَاصِ\nوَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللهُ عَلَيهِ وَسَلَّمَ\nوَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا\nوَمَا كَانَ مِنَ الْمُشْرِكِينَ","m":"(Petang) \"Kami hayati suasana petang ini atas landasan fitrah dan perwatakan islam. Berpegang kepada kalimah Ikhlas (dan prinsip) keikhlasan. Berpegang kepada agama Nabi-Mu Muhammad (SAW), yang juga agama bapa kami (Nabi) Ibrahim dengan setulus hati. Dan (Nabi) Ibrahim sama sekali bukan seorang yang musyrikin."},{"n":"","x":3,"t":1,"a":"اَللَّهُمَّ إِنِّي أَصْبَحْتُ مِنْكَ فِي نِعْمَةٍ\nوَعَافِيَةٍ وَسِتْرٍ\nفَأَتِمَّ عَلَيَّ نِعْمَتَكَ وَعَافِيَتَكَ وَسِتْرَكَ فِي الدُّنْيَا وَالآخِرَةِ","m":"(Pagi) \"Ya Allah, pagi ini kami kecapi nikmat pemberian-Mu, kesihatan dan perlindungan-Mu, maka sempurnakan nikmat, afiat dan perlindungan-Mu terhadap kami di dunia dan akhirat."},{"n":"","x":3,"t":2,"a":"اَللَّهُمَّ إِنِّي أَمْسَيْتُ مِنْكَ فِي نِعْمَةٍ\nوَعَافِيَةٍ وَسِتْرٍ\nفَأَتِمَّ عَلَيَّ نِعْمَتَكَ وَعَافِيَتَكَ وَسِتْرَكَ فِي الدُّنْيَا وَالآخِرَةِ","m":"(Petang) \"Ya Allah, petang ini kami kecapi nikmat pemberian-Mu, kesihatan dan perlindungan-Mu, maka sempurnakan nikmat, afiat dan perlindungan-Mu terhadap kami di dunia dan akhirat."},{"n":"","x":3,"t":1,"a":"اَللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ\nلَا شَرِيكَ لَكَ\nفَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ","m":"(Pagi) \"Ya Allah, apa saja nikmat yang kami dapati pagi ini dari mana-mana makhlukMu maka sebenarnya dari Engkau jua. Tidak ada sekutu bagiMu. Puji dan kesyukuran (kami) untukMu."},{"n":"","x":3,"t":2,"a":"اَللَّهُمَّ مَا أَمْسَى بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ\nلَا شَرِيكَ لَكَ\nفَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ","m":"(Petang) \"Ya Allah, apa saja nikmat yang kami dapati petang ini dari mana-mana makhluk-Mu maka sebenarnya dari Engkau jua. Tidak ada sekutu bagi-Mu. Puji dan kesyukuran (kami) untuk-Mu."},{"n":"","x":3,"t":3,"a":"يَا رَبِّي لَكَ الْحَمْدُ كَمَا يَنْبَغِي لِجَلَالِ وَجْهِكَ وَعَظِيمِ سُلطَانِكَ","m":"Wahai Tuhan, untukMu pujian yang setanding dengan kebesaran serta kemuliaan wajahMu dan keagungan kekuasaanMu."},{"n":"","x":3,"t":3,"a":"رَضِيتُ بِاللهِ رَبًّا وَبِالإِسْلَامِ دِينًا وَبِمُحَمَّدٍ نَبِيًا وَرَسُولًا","m":"Redhalah aku berTuhankan Allah, beragamakan Islam dan bernabi serta ber-Rasulkan Muhammad."},{"n":"","x":3,"t":3,"a":"سُبْحَانَ اللهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ\nوَرِضَا نَفْسِهِ\nوَزِنَةَ عَرْشِهِ\nوَمِدَادَ كَلِمَاتِهِ","m":"(Kami ucapkan) Maha Suci Allah dengan segala tahmidNya, sebanyak makhluk ciptaanNya, serela hatiNya, seberat timbangan 'ArasyNya dan sebanyak tinta kalimahNya."},{"n":"","x":3,"t":3,"a":"بِسْمِ اللهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ\nوَلاَ فِي السَّمَاءِ\nوَهُوَ السَّمِيعُ العَلِيمُ","m":"Dengan nama Allah yang dengan namaNya terpeliharalah segalanya sesuatu yang di bumi dan juga di langit daripada sebarang bahaya. Sesungguhnya Dialah yang Maha Mendengar lagi Maha Mengetahui"},{"n":"","x":3,"t":3,"a":"اَللَّهُمَّ إِنَّا نَعُوذُ بِكَ مِنْ أَن نُشْرِكَ بِكَ شَيْئًا نَعْلَمُهُ\nوَنَسْتَغْفِرُكَ لِمَا لَا نَعْلَمُهُ","m":"Ya Allah, sesungguhnya kami mohon perlindunganMu daripada mensyirikkanMu dengan sesuatu yang kami ketahui dan kami mohon ampun kepadaMu daripada apa jua perkara yang tidak kami ketahui."},{"n":"","x":3,"t":3,"a":"أَعُوْذُ بِكَلِمَاتِ اللهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ","m":"Aku berlindung(dibawah naungan) kalimah-kalimah Allah SWT yang sempurna dan selamat dari segala kejahatan makhluk yang jahat."},{"n":"","x":3,"t":3,"a":"اَللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الهَمِّ وَالحَزَنِ\nوَأَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ\nوَأَعُوذُ بِكَ مِنَ الجُبْنِ وَالبُخْلِ\nوَأَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ وَقَهْرِ الرِّجَالِ","m":"Ya Allah, aku berlindung kepadaMu dari rundungan sedih dan duka. Aku berlindung kepadaMu dari sifat lemah dan malas. Aku berlindung kepadaMu dari sifat pengecut dan kedekut. Aku berlindung kepadaMu dari beban hutang dan penindasan orang."},{"n":"","x":3,"t":3,"a":"اَللَّهُمَّ عَافِنِي فِي بَدَنِي\nاَللَّهُمَّ عَافِنِي فِي سَمْعِي\nاَللَّهُمَّ عَافِنِي فِي بَصَرِي","m":"Ya Allah, sejahterakanlah tubuh badanku\nYa Allah, sejahterakanlah pendengaranku\nYa Allah sejahterakanlah penglihatanku"},{"n":"","x":3,"t":3,"a":"اَللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ\nوَ أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ\nلَا إِلَهَ إِلَّا أَنْتَ","m":"Ya Allah, aku berlindung kepadaMu dari kufur dan kefakiran\nYa Allah, aku berlindung kepadaMu dari siksa kubur. (Ikrar kami) Tidak ada Tuhan (yang sebenarnya) kecuali Engkau."},{"n":"","x":3,"t":3,"a":"اَللَّهُمَّ أَنْتَ رَبِّي\nلَا إِلَهَ إِلَّا أَنْتَ\nخَلَقْتَنِي وَأَنَا عَبْدُكَ\nوَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ\nأَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ\nأَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ\nوَأَبُوءُ بِذَنْبِي\nفَاغْفِرْلِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ","m":"Ya Allah, Engkaulah Tuhanku, tiada tuhan kecuali Engkau. Engkaulah yang menciptakan diriku. Aku (hanyalah) hambaMu. Aku berusaha sedaya upaya untuk setia memegang janjiMu. Aku berlindung kepadaMu ya Allah akibat dari kejahatan yang terlanjur telah aku lakukan. Ya Allah, aku mengaku sekian banyak nikmatMu kepada aku dan aku mengakui juga akan sekian banyak dosaku, maka ampunkanlah dosaku. Tiada yang dapat mengampunkan dosa kecuali Engkau."},{"n":"","x":3,"t":3,"a":"أَسْتَغْفِرُ اللهَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ وَأَتُوبُ إِلَيهِ","m":"Aku mohon ampun kepada Allah yang tiada tuhan kecuali Dia, Tuhan yang sentiasa hidup dan berkekalan (mentadbir alam ini) dan aku bertaubat kepadaNya” (akan segala dosaku)."},{"n":"","x":3,"t":3,"a":"سُبْحَانَكَ اللَّّهُمَّ وَبِحَمْدِكَ أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ\nأَسْتَغْفِرُكَ وَأَتُوبُ إِلَيكَ","m":"Maha Suci Engkau ya Allah dengan segala kebesaran dan tahmid. Aku jadi saksi dan mengaku bahawa tiada Tuhan lain kecuali Engkau. Aku pohon ampun dariMu akan segala dosa kesalahan.”"},{"n":"","x":3,"t":3,"a":"اَللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ\nعَبْدِكَ وَنَبِيِّكَ وَرَسُولِكَ النَّبِيِّ اْلأُمِّيِّ\nوَعَلَى آلِهِ وَصَحْبِهِ\nوَسَلِّمْ تَسْلِيمًا عَدَدَ مَا أَحَاطَ بِهِ عِلْمُكَ وَخَطَّ بِهِ قَلَمُكَ\nوَأَحْصَاهُ كِتَابُكَ","m":"Ya Allah, restuilah dan berkatkanlah junjungan kami Muhammad, sebagai hamba, Nabi dan Rasul-Mu yang Ummi. Berkatilah keluarga dan sahabat Baginda. Sejahterakanlah Baginda selama-lamanya. Kami pohon sebanyak bilangan apa saja yang di ketahui oleh-Mu atau sebanyak perkara yang ditulis oleh kalam-Mu dan sebanyak yang dirangkum oleh kitab-Mu."},{"n":"","x":1,"t":3,"a":"وَارْضَ اللَّهُمَّ عَنْ سَادَاتِنَا أَبِي بَكْرٍ وَعُمَرَ وَعُثْمَانَ وَعَلِيٍّ\nوَعَنِ الصَّحَابَةِ أَجْمَعِينَ\nوَعَنِ التَّبِعِينَ تَابِعِيهِمْ بِإِحْسَانٍ إِلَى يَوْمِ الدِّينِ\nسُبْحَانَ رَبِّكَ رَبِّ الْعِزَّةِ عَمَّا يَصِفُونَ\nوَسَلآمٌ عَلَى الْمُرْسَلِينَ\nوَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ","m":"Terima dan redhailah ya Allah akan penghulu-penghulu kami, Sayidina Abu Bakar, Umar, Uthman, Ali dan para sahabat Baginda semuanya, juga para tabi'in dan orang yang mengikut jejak langkah mereka sehinggalah ke hari pembalasan. Terimalah (kepulangan) mereka dengan sebaik-baiknya"},{"n":"","x":1,"t":3,"a":"اَللَّهُمَّ إِنَّا نَسْأَلُكَ لِسَانًا رَطِبًا بِذِكْرِكَ\nوَقَلْبًا مَفْعُمًا بِشُكْرِكَ\nوَبَدَنًا هَيِّنًا لَيِّنًا بِطَاعَتِكَ\nاَللَّهُمَّ إِنَّا نَسْأَلُكَ إِيمَانًا كَامِلًا\nوَنَسْـأَلُكَ قَلْبًا خَاشِعًا\nوَنَسْـأَلُكَ عِلْمًا نَافِعًا\nوَنَسْأَلُكَ يَقِينًا صَادِقًا\nوَنَسْـأَلُكَ دِينًا قَيِّمًا\nوَنَسْـأَلُكَ الْعَافِيَةَ مِنْ كُلِّ بَلِيَّةٍ\nوَنَسْـأَلُكَ تَمَامَ الْغِنَى عَنِ النَّاسِ\nوَهَبْ لَنَا حَقِيقَةَ الإِيمَانِ بِكَ\nحَتَّى لَا نَخَافَ\nوَلَا نَرْجُوَ غَيرَكَ\nوَلَا نَعْبُدَ شَيْئًا سِوَاكَ\nوَاجْعَلْ يَدَكَ مَبْسُوطَةً عَلَيْنَا\nوَعَلَى أَهْلِينَا\nوَأَوْلَادِنَا\nوَمَنْ مَعَنَا بِرَحْمَتِكَ\nوَلَا تَكِّلْنَا إِلَى أَنْفُسِنَا طَرْفَةَ عَيْنٍ\nوَلَا أَقَلَّ مِنْ ذَلِكَ\nيَا نِعْمَ الْمُجِيبُ\n\nوَصَلَّ اللهُ عَلَى سَيِّدِنَا مُحَمَّدٍ النَّبِيِّ الْكَرِيمِ\nوَعَلَى اَلِهِ وَصَحْبِهِ أَجْمَعِينَ","m":"Ya Allah kurniakanlah kami lisan yang lembut basah mengingati dan menyebut (nama) Mu, serta badan yang ringan menyempurnakan ketaatan kepada perintahMu. Ya Allah, kurniakanlah kami iman yang sempurna, hati yang khusyuk, ilmu yang berguna keyakinan yang benar-benar mantap. (Ya Allah) kurniakanlah kami (ad-Deen) cara hidup yang jitu dan unggul selamat dari segala mara bahaya dan petaka. Kami mohon (Ya Allah) kecukupan yang tidak sampai terpaksa meminta jasa orang lain. Berikanlah kami (Ya Allah) iman yang sebenarnya sehingga kami tidak lagi gentar atau mengharapkan orang lain selain dari Engkau sendiri. Kembangkanlah lembayung rahmatMu kepada kami, keluarga dan anak-anak kami serta sesiapa sahaja yang bersama-sama kami. Janganlah (Ya Allah) Engkau biarkan nasib kami ditentukan oleh diri kami sendiri, walaupun kadar sekelip mata atau kadar masa yang lebih pendek dari itu. Wahai Tuhan yang mudah dan cepat memperkenankan permintaan” (perkenankanlah)."},{"n":"Al Imran (26)","x":1,"t":3,"a":"قُلِ اللَّهُمَّ مَالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَنْ تَشَاءُ وَتَنْزِعُ الْمُلْكَ مِمَّنْ تَشَاءُ وَتُعِزُّ مَنْ تَشَاءُ وَتُذِلُّ مَنْ تَشَاءُ بِيَدِكَ الْخَيْرُ إِنَّكَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ٢٦","m":"(26) Katakanlah: \"Katakanlah, Ya Allah, pemilik kekuasaan (kerajaan) alam buana, Engkau memberi kekuasaan kepada sesiapa yang Engkau suka. Engkau merampas kekuasaan itu dari siapa sahaja yang Engkau mahu. Engkau berkuasa memuliakan dan menghina siapa yang Engkau mahu. Di tanganMu (wahai Allah) segala kebaikan dan kekayaan. Sesungguhnya, Engkau berkuasa untuk berbuat apa sahaja."},{"n":"Al Imran (27)","x":1,"t":3,"a":"تُولِجُ اللَّيْلَ فِي النَّهَارِ وَتُولِجُ النَّهَارَ فِي اللَّيْلِ وَتُخْرِجُ الْحَيَّ مِنَ الْمَيِّتِ وَتُخْرِجُ الْمَيِّتَ مِنْ الْحَيِّ وَتَرْزُقُ مَنْ تَشَاءُ بِغَيْرِ حِسَابٍ٢٧","m":"(27) Engkau mengganti siang dengan malam dan menggantikan malam dengan siang. Engkau menerbitkan sesuatu yang hidup dari sesuatu yang kaku (mati) dan Engkau menerbitkan sesuatu yang mati dari sesuatu yang hidup. Engkau memberi rezeki tanpa berhitung kepada sesiapa sahaja yang Engkau mahu."},{"n":"","x":1,"t":2,"a":"اَللَّهُمَّ إِنَّ هَذَا إِقْبَالُ لَيْلِكَ وَإِدْبَارُ نَهَارِكَ وَأَصْوَاتُ دُعَاتِكَ فَاغْفِرْلِي","m":"Ya Allah, menjelanglah kini malam (ciptaan)-Mu, beredarlah sudah siang-Mu, inilah keluhan suara dan pinta para du'at-Mu. Maka oleh itu ampunkanlah dosaku."},{"n":"","x":1,"t":3,"a":"اَللَّهُمَّ إِنَّكَ تَعْلَمُ أَنَّ هَذِهِ الْقُلُوبَ\nقَدِ اجْتَمَعَتْ عَلَى مَحَبَّتِكْ\nوَالتَقَتْ عَلَى طَاعَتِكَ\nوَتَوَحَّدَتْ عَلَى دَعْوَتِكَ\nوَتَعَاهَدَتْ عَلَى نَصْرَةِ شَرِيعَتِكَ\nفَوَثِّقِ اللَّهُمَّ رَابِطَتَهَا\nوَاَدِمْ وُدَّهَا\nوَاهْدِهَا سُبُلَهَا\nوَامْلَأهَا بِنُورِكَ الَّذِي لَا يَخْبُوا\nوَاشْرَحْ صُدُورَهَا بِفَيضِ الإِيمَانِ بِكَ\nوَجَمِيلِ التَّوَكُّلِ عَلَيكَ وَأَحْيِهَا بِمَعْرِفَتِكَ\nوَأَمِتْهَا عَلَى الشَّهَادَةِ فِي سَبِيلِكَ\nإِنَّكَ نِعْمَ الْمَوْلَى وَنِعْمَ النَّصِيرُ\nوَصَلَّى اللهُ عَلَى سَيِّدِنَا مُحَمَّدٍ\nوَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّم","m":"Ya Allah, Engkau mengetahui bahawa hati-hati ini ....(bayangkan wajah-wajah rakan persejuangan) telah berkumpul kerana mengasihiMu, bertemu untuk mematuhi (perintahMu), bersatu memikul beban dakwahMu. Hati-hati ini telah mengikat janji setia mendaulat dan menyokong syariatMu. Maka eratkanlah ya Allah ikatannya. Kekalkan kemesraan antara hati-hati ini. Tunjukkanlah kepada hati-hati ini dengan limpahan iman/keyakinan dan keindahan tawakkal kepada-Mu. Hidup suburkan hati-hati ini dengan pengetahuan sebenar tentangMu Jika Engkau mentakdirkan mati maka matikanlah pemilik hati-hati ini sebagai para syuhada dalam perjuangan agamaMu. Engkau lah sebaik-baik sandaran dan sebaik-baik penolong. Ya Allah, perkenankanlah permintaan ini. Ya Allah restuilah dan sejahterakanlah junjungan kami (Nabi) Muhammad, keluarga dan para sahabat baginda semuanya. Amin."}]};

const MSUR={"Al Fatihah (1-7)":1,"Al Ikhlas (1-4)":112,"Al Falaq (1-5)":113,"An Nas (1-6)":114};
function renderReader(){const l=rl(),T=RT[l],rtl=l==="ar";setCredit();
  const trLang=l==="id"?"id":"ms";
  $("rhead").innerHTML=`<button id="rback">${T.back}</button>
   <h2 class="ztitle">${T.title}</h2><p class="zsub">${T.sub}</p>
   <div class="ztabs rtabs">${["yasin","mathurat","audio"].map((v,i)=>`<button data-rv="${v}" aria-pressed="${rview===v}">${i<2?T.tabs[i]:qt().tab}</button>`).join("")}</div>
   <div class="rtools"><button id="rminus" aria-label="Kecilkan">A−</button><button id="rplus" aria-label="Besarkan">A+</button><label class="rtr"><input type="checkbox" id="rtrc" ${rtr?"checked":""}> ${T.tr}</label></div>`;
  let h="";
  if(rview==="yasin"){
    h+=`<div class="zinfo"><p>${T.yasinInfo}</p></div><p class="qbasm">بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ</p>`;
    h+=RD.yasin.ar.map((a,i)=>`<div class="qaya"><p class="qar" dir="rtl" lang="ar">${a} <span class="qnum">${ayaNum(i+1)}</span></p>${rtr?`<p class="qtr"><b>${i+1}.</b> ${RD.yasin[trLang][i]}</p>`:""}</div>`).join("");
  }else if(rview==="audio"){const Q=qt();
    h+=`<div class="zinfo"><p>${Q.info}</p></div><label class="kfl">${Q.qari}<select id="qari">${QARI.map(r=>`<option value="${r.id}"${r.id===qQari().id?" selected":""}>${r.n}</option>`).join("")}</select></label>
    <div class="pbtns"><button id="qall" class="act">${(qOn&&qList.length>1)?Q.stop:Q.all}</button><button id="qdlall">${Q.dlAll}</button></div><p class="src" id="qmsg"></p><p class="src">${Q.credit}</p>`;
    const sel=qSel(),row=([n,nm,ar],big)=>`<div class="place qsur"><div class="pname">${nm} <span class="qsar" lang="ar">${ar}</span></div><p class="pmeta">Surah ${n}${big?" · "+Q.big:""}</p><label class="qsel"><input type="checkbox" data-qs="${n}" ${sel.includes(n)?"checked":""}> ${Q.sel}</label><div class="qb2"><button data-q="${n}">${Q.play}</button><button class="qdl" data-qd="${n}">${qOffKeys.has(qKey(n))?Q.saved:Q.dl}</button></div></div>`;
    h+=`<p class="src">${Q.selInfo}</p><h3 class="zh3">${Q.gS}</h3>`+SURAH.map(x=>row(x,false)).join("")+`<h3 class="zh3">${Q.gL}</h3>`+SURAH_L.map(x=>row(x,true)).join("");
  }else{
    h+=`<div class="zinfo"><p>${T.mInfo}</p></div><div class="ztabs rtime"><button data-rt="1" aria-pressed="${rtime===1}">${T.pagi}</button><button data-rt="2" aria-pressed="${rtime===2}">${T.petang}</button></div>`;
    RD.mathurat.forEach((m,i)=>{if(!(m.t===3||m.t===rtime))return;const k=rtime+"-"+i,c=rcount[k]||0,ok=c>=m.x;
      h+=`<div class="qaya mitem${ok?" mdone":""}" data-k="${k}" data-x="${m.x}">${m.n?`<div class="mname">${m.n}</div>`:""}<p class="qar" dir="rtl" lang="ar">${m.a.replace(/([٠-٩]+)/g," ﴿$1﴾ ")}</p>${rtr&&m.m?`<p class="qtr">${m.m}</p>`:""}${MSUR[m.n]?`<button data-q="${MSUR[m.n]}" data-qk="${k}" class="mplay">${qt().play}</button> `:""}<button class="mcount">${ok?"✓ "+T.done:"×"+m.x+" · "+c+"/"+m.x+" · "+T.tap}</button></div>`;});
    h+=`<button id="rreset" class="zreset">${T.reset}</button>`;
  }
  h+=`<p class="src">${T.src}</p>`;
  $("rbody").innerHTML=h;
  document.querySelectorAll("[data-rv]").forEach(b=>b.onclick=()=>{rview=b.dataset.rv;renderReader();$("rcard").scrollTop=0;});
  document.querySelectorAll("[data-rt]").forEach(b=>b.onclick=()=>{rtime=+b.dataset.rt;renderReader();});
  document.querySelectorAll(".mcount").forEach(b=>b.onclick=()=>{const d=b.closest(".mitem"),k=d.dataset.k,x=+d.dataset.x;rcount[k]=Math.min(x,(rcount[k]||0)+1);const y=$("rcard").scrollTop;renderReader();$("rcard").scrollTop=y;});
  if($("rreset"))$("rreset").onclick=()=>{rcount={};renderReader();};
  $("rminus").onclick=()=>setRSize(-2);$("rplus").onclick=()=>setRSize(2);
  $("rtrc").onchange=e=>{rtr=e.target.checked;const y=$("rcard").scrollTop;renderReader();$("rcard").scrollTop=y;};
  $("rback").onclick=()=>{qStop();$("reader").style.display="none";openJourney(jstep);};
  document.querySelectorAll("#rbody [data-q]").forEach(b=>b.onclick=()=>{const k=b.dataset.qk;qToggleOne(+b.dataset.q,k?(()=>{const it=document.querySelector(`.mitem[data-k="${k}"]`);const x=it?+it.dataset.x:1;rcount[k]=Math.min(x,(rcount[k]||0)+1);const y=$("rcard").scrollTop;renderReader();$("rcard").scrollTop=y;}):null);});
  document.querySelectorAll("[data-qs]").forEach(c=>c.onchange=()=>{const a=[...document.querySelectorAll("[data-qs]")].filter(x=>x.checked).map(x=>+x.dataset.qs);qSetSel(a);});
  const qs=document.getElementById("qari");if(qs)qs.onchange=()=>{try{localStorage.setItem("su-qari",qs.value);}catch(e){}qStop();renderReaderKeep();};
  document.querySelectorAll("[data-qd]").forEach(b=>b.onclick=()=>{const n=+b.dataset.qd;if(qOffKeys.has(qKey(n))){qRemoveOff(n).then(renderReaderKeep);return;}
    b.textContent="⏳";b.disabled=true;qDownload(n).then(renderReaderKeep).catch(()=>{const o=document.getElementById("qmsg");if(o)o.textContent=qt().dlErr;b.disabled=false;b.textContent=qt().dl;});});
  const da=document.getElementById("qdlall");if(da)da.onclick=async()=>{da.disabled=true;const sel=qSel();let k=0;for(const n of sel){if(qOffKeys.has(qKey(n))){k++;continue;}da.textContent=`⏳ ${k}/${sel.length}`;
    try{await qDownload(n);k++;}catch(e){const o=document.getElementById("qmsg");if(o)o.textContent=qt().dlErr;break;}}renderReaderKeep();};
  const qa1=document.getElementById("qall");if(qa1)qa1.onclick=()=>{if(qOn&&qList.length>1)qStop();else qPlay(qSel(),false);};
  qUI();
}

    const k=end?(end==="S"?((s.legs||0)===0?"safa1":"safa"):"marwah"):((t>0.26&&t<0.38)?"green":"walk");
    if(k===s.vkc)s.vkcn=(s.vkcn||0)+1;else{s.vkc=k;s.vkcn=1;}

    if(n<7){const k=n!==s.vn?"aswad":segOfDeg(((g%lapM(s))/lapM(s))*360);if(k!==s.vk||n!==s.vn){if(n!==s.vn)lapBuzz(n+1);const head=(n!==s.vn)?(n===0?VTX[lang].tawafStart+". ":"")+(TXT[lang]||TXT.bm).lap+" "+(n+1):"";s.vk=k;s.vn=n;if(s.v)vTawaf(k,head,true);}}}

    if(!tlast){tlast=pt;TS.pts.push([+pt[0].toFixed(6),+pt[1].toFixed(6),TS.seg]);}
    else{const d=hav(tlast,pt),sp=d/Math.max(0.001,(pt[2]-tlast[2])/1000);

  x.fillStyle="#ffffff";x.font="bold 76px sans-serif";x.fillText(miniFit(x,i.a,W-48),24,158);
  x.font="bold 42px sans-serif";x.fillText(i.b,24,226);x.fillText(i.c,W/2,226);
  x.fillStyle="#cfe3d6";x.font="28px sans-serif";x.fillText(miniFit(x,i.d,W-48),24,300);x.fillText("🕋",W-64,300);
  const now=Date.now();if("mediaSession" in navigator&&now-MINI.ms>5000&&window.MediaMetadata){MINI.ms=now;try{navigator.mediaSession.metadata=new MediaMetadata({title:i.h,artist:[i.a,i.b,i.c].filter(Boolean).join(" · "),album:"Simulasi Umrah V2",artwork:[{src:"icon-192.png",sizes:"192x192",type:"image/png"},{src:"icon-512.png",sizes:"512x512",type:"image/png"}]});}catch(e){}}}
function miniPrep(){if(MINI.vid)return MINI.vid.play().catch(()=>{});const c=document.createElement("canvas");c.width=640;c.height=340;MINI.cv=c;miniDraw();
  const v=document.createElement("video");v.muted=true;v.playsInline=true;v.setAttribute("playsinline","");v.setAttribute("autopictureinpicture","");try{v.autoPictureInPicture=true;}catch(e){}
  v.style.cssText="position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none;z-index:-1";document.body.appendChild(v);MINI.vid=v;
  try{v.srcObject=c.captureStream?c.captureStream(2):null;}catch(e){}
  clearInterval(MINI.t);MINI.t=setInterval(miniDraw,1000);return v.play().catch(()=>{});}
async function miniOpen(){try{if(document.pictureInPictureElement){await document.exitPictureInPicture();return;}
  if(!(HTMLCanvasElement.prototype.captureStream)){flash(mt().un);return;}
  const p=miniPrep();const v=MINI.vid;
  if(v.requestPictureInPicture&&document.pictureInPictureEnabled){await p;await v.requestPictureInPicture();}
  else if(v.webkitSupportsPresentationMode&&v.webkitSupportsPresentationMode("picture-in-picture")){v.webkitSetPresentationMode("picture-in-picture");}
  else flash(mt().un);}catch(e){flash(mt().un);}}
function miniStop(){clearInterval(MINI.t);MINI.t=null;try{if(document.pictureInPictureElement)document.exitPictureInPicture();}catch(e){}
  if(MINI.vid){try{MINI.vid.pause();MINI.vid.srcObject=null;MINI.vid.remove();}catch(e){}}MINI.vid=null;MINI.cv=null;}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&MINI.vid&&!document.pictureInPictureElement&&MINI.vid.requestPictureInPicture){MINI.vid.requestPictureInPicture().catch(()=>{});}});

function openZiarah(){hideHint();playing=false;setMode("sim");activity="journey";["hud","map","bar","intro","journey"].forEach(id=>$(id).style.display="none");$("ziarah").style.display="grid";renderZiarah();$("zcard").scrollTop=0;}

/* ---------- 360° look hint ---------- */
function showHint(){if(gyroOn||renderer.xr.isPresenting)return;$("hintTxt").textContent=MISC[lang].hint;$("hint").style.display="flex";clearTimeout(showHint.t);showHint.t=setTimeout(hideHint,7000);}
function hideHint(){$("hint").style.display="none";}

/* ---------- Light / dark theme ---------- */
function applyTheme(t,pick){document.documentElement.setAttribute("data-theme",t);
  document.querySelectorAll(".themeBtn").forEach(b=>{b.textContent=t==="dark"?"☀️":"🌙";b.title=t==="dark"?"Cerah / Light":"Gelap / Dark";});
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content",t==="dark"?"#0f3d2e":"#17894f");
  if(pick)try{localStorage.setItem("su-theme-pick",t);}catch(e){}}
/* ikut tetapan cerah/gelap telefon sehingga pengguna memilih tema sendiri */
(function(){let t=null;try{t=localStorage.getItem("su-theme-pick");localStorage.removeItem("su-theme");}catch(e){}
  const mq=matchMedia("(prefers-color-scheme: dark)"),sys=()=>applyTheme(mq.matches?"dark":"light");
  if(t==="light"||t==="dark"){applyTheme(t);return;}
  sys();const f=()=>{let p=null;try{p=localStorage.getItem("su-theme-pick");}catch(e){}if(!p)sys();};
  if(mq.addEventListener)mq.addEventListener("change",f);else if(mq.addListener)mq.addListener(f);})();
document.querySelectorAll(".themeBtn").forEach(b=>b.onclick=()=>applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark",true));
/* saiz teks A− / A+ (disimpan dalam peranti) */
const FS=[1,1.15,1.3,1.45];
function fsGet(){let v=1;try{v=+localStorage.getItem("su-fs")||1;}catch(e){}return FS.includes(v)?v:1;}
function fsSet(v){document.documentElement.style.setProperty("--fs",v);const i=FS.indexOf(v);$("fsDn").disabled=i<=0;$("fsUp").disabled=i>=FS.length-1;try{localStorage.setItem("su-fs",v);}catch(e){}}
fsSet(fsGet());
$("fsDn").onclick=()=>{const i=FS.indexOf(fsGet());if(i>0)fsSet(FS[i-1]);};
$("fsUp").onclick=()=>{const i=FS.indexOf(fsGet());if(i<FS.length-1)fsSet(FS[i+1]);};

$("zopen").onclick=openZiarah;$("ropen").onclick=openReader;$("kopen").onclick=openTrk;
/* sambung dari tempat terakhir (bahasa, langkah, ihram, tetapan) */
(function(){let st=null;try{st=JSON.parse(localStorage.getItem("su-state"));}catch(e){}
  if(st&&typeof st==="object"){
    if(Number.isInteger(st.jstep))jstep=Math.max(0,Math.min(J.bm.length-1,st.jstep));
    ihram=!!st.ihram;cutN=Math.max(0,Math.min(3,st.cutN|0));
    if(st.sex==="m"||st.sex==="f")sex=st.sex;
    if([0.6,1,1.6].includes(st.crowdMul))crowdMul=st.crowdMul;
    document.querySelectorAll("[data-sex]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.sex===sex)));
    document.querySelectorAll("[data-crowd]").forEach(x=>x.setAttribute("aria-pressed",String(+x.dataset.crowd===crowdMul)));
    if(LANGS[st.lang]&&st.lang!==lang)setLang(st.lang);}
  stReady=true;setTset();})();
renderJourney();

/* ---------- Loop ---------- */
const clock=new THREE.Clock();
placeRig();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.1);
  const simDt=dt*(playing?speed:0);
  if(activity==="sai"){updateSai(dt,simDt);saiT+=simDt||dt*.15;updateSaiCrowd(simDt||dt*.15,saiT);placeSaiRig();
    if(!renderer.xr.isPresenting){if(gyroOn)applyGyro();else camera.rotation.set(pitchOff,yawOff,0);camera.position.y=1.6+Math.abs(Math.sin(saiT*5))*.02;}
    renderSaiHud();drawSaiMap();renderer.render(sScene,camera);return;}
  if(mode!=="sim"){
    if(!finished&&realv.duration){const f=Math.min(1,realv.currentTime/realv.duration);th=(mode==="v360"&&v360Full)?TOTAL*f:(realLap-1)*Math.PI*2+Math.PI*2*f;}
    const lp=lapNum();if(lp!==lastLap&&lp>0&&!finished){flash(TXT[lang].newlap(lp));lastLap=lp;}
  } else if(playing&&!finished){
    const ramlF=(sex==="m"&&th>=0&&th<Math.PI*6)?1.25:1;
    th+=WALK*ramlF*simDt/R0;
    if(th>=TOTAL){th=TOTAL;finished=true;playing=false;buildBar();flash(TXT[lang].done);}
    const lp=lapNum();if(lp!==lastLap&&lp>0&&!finished){flash(TXT[lang].newlap(lp));lastLap=lp;}
  }
  const realFlat=mode==="real"&&!renderer.xr.isPresenting;
  simT+=simDt||dt*.15;
  if(!realFlat&&mode!=="v360")updateCrowd(mode==="real"?dt:(simDt||dt*.15),simT);
  placeRig();
  if(!renderer.xr.isPresenting){if(gyroOn)applyGyro();else{camera.rotation.set(pitchOff,yawOff,0);}camera.position.y=1.6+Math.abs(Math.sin(simT*5))*.02;}
  renderHud();drawMap();
  if(!realFlat)renderer.render(scene,camera);
});
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
/* fokus ke tajuk skrin baharu supaya pembaca skrin mengumumkannya */
["journey","intro","ziarah","reader","trk"].forEach(id=>{const el=$(id);let was=getComputedStyle(el).display!=="none";
  new MutationObserver(()=>{const now=getComputedStyle(el).display!=="none";if(now&&!was){const h=el.querySelector("h1,h2");if(h){h.setAttribute("tabindex","-1");try{h.focus({preventScroll:true});}catch(e){}}}was=now;}).observe(el,{attributes:true,attributeFilter:["style"]});});
/* ---------- Butang Kembali peranti: kembali ke Panduan, bukan menutup aplikasi ---------- */
const shown=id=>{const e=$(id);return !!e&&getComputedStyle(e).display!=="none";};
function navGuard(){try{if(!(history.state&&history.state.su))history.pushState({su:1},"");}catch(e){}}
new MutationObserver(()=>{if(!shown("journey"))navGuard();}).observe($("journey"),{attributes:true,attributeFilter:["style"]});
addEventListener("popstate",()=>{
  if(shown("kpocket")){navGuard();return;}
  if(moreOpen()){moreSet(false);navGuard();return;}
  if(shown("bar"))$("guideBtn").click();
  else if(shown("reader")){const b=$("rback");if(b)b.click();else{$("reader").style.display="none";openJourney(jstep);}}
  else if(shown("trk")){$("trk").style.display="none";openJourney(jstep);}
  else if(!shown("journey"))openJourney(jstep);
  else history.back();
});
setTimeout(()=>{try{const op=new URLSearchParams(location.search).get("open");if(op==="trk")openTrk();else if(op==="reader")openReader();else if(op==="ziarah")openZiarah();}catch(e){}},500);
})();
</script>
<script>
(function(){
const ms=()=>!(document.documentElement.lang||"ms").startsWith("en");
const T=()=>ms()?{inst:"📲 Pasang aplikasi",ios:"Untuk memasang di iPhone: tekan ••• atau butang Kongsi (petak dengan anak panah ke atas), pilih “Tambah ke Skrin Utama”, kemudian Tambah.",upd:"🔄 Versi baharu aplikasi tersedia.",reload:"Muat semula",close:"Tutup"}
 :{inst:"📲 Install app",ios:"To install on iPhone: tap ••• or the Share button (square with an up arrow), choose “Add to Home Screen”, then Add.",upd:"🔄 A new version of the app is available.",reload:"Reload",close:"Close"};
let dp=null;const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);

 d.querySelector("p").textContent=msg;const b1=d.querySelector(".b1");if(btn){b1.textContent=btn;b1.onclick=fn;}else b1.remove();const b2=d.querySelector(".b2");b2.textContent=T().close;b2.onclick=()=>d.remove();document.body.appendChild(d);}
addEventListener("load",()=>{const b=document.getElementById("instBtn");
 if(b)b.onclick=async()=>{if(dp){dp.prompt();try{await dp.userChoice;}catch(e){}dp=null;show();}else banner(T().ios);};
 show();setInterval(show,4000);
 if("serviceWorker" in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register("sw.js").catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had)banner(T().upd,T().reload,()=>location.reload());});}});
})();
